    judge-in/ contained only T2-A.md, T2-B.md and T2-C.md. The rubric's REFERENCE
    (the ground-truth frozen spec) was NOT supplied. I located it in the repo at
    docs/specs/SPEC-0085-spec-token-capture-canary.md (shipped by commit b2d8041,
    PR 158) and used it as REFERENCE for M2/M5 only. It was never treated as a
    candidate. No variant names, prompt texts, byte counts or the blinding key
    were read.
  base_ref_used: d1e4c99 (b2d8041^ — the tree immediately before the ride landed)
  m6_method: >
    Every named path, script, flag and convention was checked with
    `git cat-file -e <base_ref>:<path>` or by reading the argument parser at
    base_ref. Counting rule applied uniformly: an item asserted as fact is
    COUNTED; an item carrying an explicit hedge plus a named reconciliation step
    is LISTED but NOT counted.

