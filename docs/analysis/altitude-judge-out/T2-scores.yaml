  - D1 metrics-flush 3-way classification (decomposed | undecomposed-note | capture-missing) with per-run INFO/WARNING
  - D2 state.mjs cmdLogTick duration-0 and missing-harness stderr WARNINGs, warn-not-block
  - D3 SUBAGENT_PROTOCOL merge protocol + SKILL_LOOP step 4 MANDATORY usage-note wording
  - D4 SUBAGENT_PROTOCOL D3 prose reclassification (the prose asserting the flush WARNING fires for an undecomposed total must be corrected to INFO)
  - D5 reconciliation of the two EXISTING stanzas that pin the old single-warning behavior (test-aai-token-capture.sh TEST-005, test-aai-metrics.sh TEST-009)
  - D6 prompt-diet ledger true-up (JUSTIFIED_ADDITIONS) + TEST-012 pinned-total bump in tests/skills/test-aai-prompt-diet.sh
  - D7 full-suite regression gate
  - "plan attributes: strategy hybrid; worktree recommended; user_decision REQUIRED (ceremony_level 3, WORKFLOW rule 8)"

