cross_candidate_observations:
  - "M2 did not separate the three on this task. All three cover D1, D2, D3, D6 and D7 and all three miss the same two ground-truth deliverables (D4 the D3-prose reclassification, D5 the reconciliation of the two stanzas pinning the old single-warning behavior). Both misses trace to the same root: none of the three planned for the fact that the change EVOLVES an existing documented-and-tested contract rather than adding a new one."
  - "All three chose tdd; the ride shipped hybrid. Only B considered hybrid and rejected it with a stated reason. M3 scores the contract against each candidate's own declared strategy, so no candidate is penalised for the divergence."
  - "One hallucination is common to all three (`.aai/scripts/spec-freeze.mjs`) and a second is common to all three (treating tests/skills/lib/prompt-diet-ledger.sh, a pure sourced library, as a runnable check). Neither differentiates; both were counted uniformly."
  - "No candidate located the file that actually owns the TEST-012 pinned total (tests/skills/test-aai-prompt-diet.sh); B additionally asserts a false claim about where it lives."
