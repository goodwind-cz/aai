# Docs audit policy (RFC-0002 D4). Committed, project-owned.
# Docs first committed before legacy_until_date soft-warn; newer docs and
# untracked files hard-fail --check when non-compliant.
legacy_until_date: 2026-06-12
stale_after_days: 90
scan_exclude: []
backlog_globs: []
# SPEC-0011 G5 — close-time gate enforcement (opt-in). Consulted ONLY by the
# CALLERS (the AAI:INDEX-AUTOGEN pre-commit hook and the closeout skills) to choose
# block-vs-warn; `docs-audit.mjs --gate <ID>` itself always returns the raw
# predicate exit code. Values: enforce | report-only. Default (key or file absent)
# is report-only — a failing close gate warns but never blocks the commit.
close_gate: report-only
# SPEC-0015 / RFC-0007 — parallel-safe doc-numbering guards (no-DRAFT-at-merge +
# duplicate-number), consulted by the pre-commit host (pre-commit-checks.sh/.ps1)
# AND by the CI mirror (.github/workflows/docs-numbering.yml) to choose
# block-vs-warn. Values: enforce | report-only. Absent key/file falls open to
# report-only, but the shipped default is ENFORCE (spec-learned-to-layer-promotion:
# flow proven across 8 allocations): a staged/merged DRAFT or duplicate number
# BLOCKS. Safe for in-flight branches — the guard reads the STAGED tree
# (git ls-files), and /aai-pr allocates numbers before staging, so untracked
# working-tree drafts never block. Projects may set report-only.
doc_number_guard: enforce
# spec-product-docs-enforced D3 — close-time product-doc gate (opt-in via the
# PRIMARY work-item doc's frontmatter `user_visible: true`; absent key stays
# ungated). Consulted ONLY by close-work-item.mjs to choose warn-vs-refuse for
# a user_visible scope closing without a real docs/product/<ref>.md. Values:
# enforce | report-only. Default (key or file absent, or an invalid value) is
# report-only, fail-open — a missing/placeholder product doc warns loudly on
# stderr but never blocks the close. AAI core ships this key report-only.
product_doc_gate: report-only
# spec-telemetry-completeness (Enforcement design A) — close-time usage-capture
# gate (opt-in). Consulted ONLY by close-work-item.mjs to choose warn-vs-refuse
# when a closing ride's STATE agent_runs include a harness-dispatched-role run
# (Planning, Implementation, TDD Implementation, Validation, Code Review,
# Remediation) with no usage_total_tokens marker, no decomposed tokens_in/out,
# and no usage_capture=none sentinel. Values: enforce | report-only. Default
# (key or file absent, or an invalid value) is report-only, fail-open — an
# unmarked run WARNS loudly on stderr (naming ref + role) but never blocks the
# close. AAI core ships this key report-only.
#
# ENFORCE ESCAPE HATCH (intake Constraints): a missing marker cannot, by
# itself, distinguish "orchestrator forgot to record usage" from "the harness
# genuinely exposed no usage". A run that honestly had no usage records the
# sentinel note `usage_capture=none`, which counts as captured and passes even
# under enforce — enforce must not punish an honest gap. Meta-roles
# (Orchestration, Metrics Flush) and any unrecognized role are never gated.
usage_capture_gate: enforce
# Flipped report-only -> enforce 2026-08-11 (pre-registered KPI gate, CHANGE-0105
# rollout): since the gate landed (2026-08-02) coverage is 26/26 runs = 100%
# usage markers AND 100% prompt_hash across 3 rides (pre-gate baseline: 46%).
# The usage_capture=none sentinel remains the honest escape hatch.
# RFC-0009 / spec-scale-adaptive-ceremony — L3 protected surfaces (project-owned
# config; the POLICY and these canonical defaults live in
# .aai/workflow/WORKFLOW.md "Ceremony levels"). A spec whose scope touches any
# listed path MUST declare `ceremony_level: 3` at freeze; review may
# re-classify a level upward (recorded finding). Consult-time policy for
# Planning/review — no mechanical diff enforcement yet (phase 2 candidate).
protected_paths_l3:
  - .aai/scripts/state.mjs
  - .aai/scripts/lib/state-engine.mjs
  - .aai/scripts/lib/state-core.mjs
  - .aai/scripts/allocate-doc-number.mjs
  - .aai/scripts/pre-commit-checks.sh
  - .aai/scripts/pre-commit-checks.ps1
  - .aai/workflow/WORKFLOW.md
  - docs/CONSTITUTION.md
# CHANGE docs-ai-canon — project-owned ADDITIONS to the vendored inventory of
# allowed DIRECT children of docs/ai/ (.aai/system/DOCS_AI_CANON.list). Plain
# basenames only (a path-shaped entry is ignored). Anything under docs/ai/ that
# is in neither list is reported by docs-audit as `docs/ai non-canonical` with a
# remediation hint — report-only: it never flips the verdict or an exit code.
# Kept here, not in the vendored list, so an /aai-update never clobbers a target
# project's legitimate extra entry. AAI core needs no extras — its whole docs/ai
# inventory is canonical.
docs_ai_canon_extra: []
