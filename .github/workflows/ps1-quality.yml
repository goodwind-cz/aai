name: ps1-quality

# Guards the vendored PowerShell scripts (.aai/scripts/*.ps1) against the class of
# failure that broke /aai-update: a parse error that only surfaces when a user
# runs the script. Two jobs:
#   - gate:          the full bash quality gate on Linux (parse-check + PSScript-
#                    Analyzer 5.1/7.0 syntax compat + Pester smoke tests) under pwsh 7.
#   - windows-5_1:   parse-check every .ps1 under REAL Windows PowerShell 5.1 —
#                    the actual environment that broke — plus pwsh 7, AND a
#                    functional aai-sync.ps1 smoke into a fresh target (catches
#                    runtime copy behavior a parse check cannot, e.g. the
#                    Copy-Item DirectoryNotFoundException on .codex/skills).

on:
  push:
    branches: [main]
    paths:
      - '.aai/scripts/**.ps1'
      - '.aai/scripts/PSScriptAnalyzerSettings.psd1'
      - 'tests/skills/test-ps1-quality.sh'
      - 'tests/skills/aai-update.Tests.ps1'
      - 'tests/skills/aai-win-dispatch.Tests.ps1'
      - '.github/workflows/ps1-quality.yml'
  pull_request:
    paths:
      - '.aai/scripts/**.ps1'
      - '.aai/scripts/PSScriptAnalyzerSettings.psd1'
      - 'tests/skills/test-ps1-quality.sh'
      - 'tests/skills/aai-update.Tests.ps1'
      - 'tests/skills/aai-win-dispatch.Tests.ps1'
      - '.github/workflows/ps1-quality.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gate:
    name: ps1 gate (Linux, pwsh 7 + PSScriptAnalyzer + Pester)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules
          key: ps-modules-${{ runner.os }}-pssa1.25-pester5

      - name: Install PSScriptAnalyzer + Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module PSScriptAnalyzer -ListAvailable)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          if (-not (Get-Module Pester -ListAvailable | Where-Object { $_.Version.Major -ge 5 })) {
            Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck
          }
          "PSScriptAnalyzer $((Get-Module PSScriptAnalyzer -ListAvailable | Select-Object -First 1).Version)"
          "Pester $((Get-Module Pester -ListAvailable | Sort-Object Version -Descending | Select-Object -First 1).Version)"

      - name: Run ps1-quality gate
        shell: bash
        run: |
          set +e
          bash tests/skills/test-ps1-quality.sh
          rc=$?
          # 0 = pass, 1 = fail, 42 = skipped (pwsh missing — should not happen here).
          if [ "$rc" -eq 42 ]; then
            echo "::warning::ps1-quality gate skipped (pwsh unexpectedly unavailable)"
            exit 0
          fi
          exit "$rc"

  windows-5_1:
    name: parse-check + functional sync smoke under Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Functional sync smoke under Windows PowerShell 5.1 (fresh target)
        # Runs the REAL aai-sync.ps1 into a fresh target on Windows PowerShell 5.1
        # — the exact environment + operation that broke a field install with
        # "Copy-Item ... DirectoryNotFoundException" on .codex/skills. A parse
        # check cannot catch a runtime copy behavior; this can. Asserts the
        # agent-skill dirs that mix a top-level README with subfolders are fully
        # populated (they exercise Copy-Replace's create-dest-then-copy path).
        shell: powershell   # Windows PowerShell 5.1 (the field environment)
        run: |
          $ErrorActionPreference = "Stop"
          $target = Join-Path $env:RUNNER_TEMP "aai-sync-smoke"
          if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          git init -q $target
          & .\.aai\scripts\aai-sync.ps1 -TargetRoot $target -Profile extended
          $fail = 0
          foreach ($p in @(".codex/skills/README.md", ".gemini/skills/README.md")) {
            if (-not (Test-Path (Join-Path $target $p))) { Write-Host "MISSING $p"; $fail++ }
          }
          # CHANGE seed-update-config: a fresh sync must SEED the auto-update
          # policy file so the `auto` opt-in knob is discoverable (parity with
          # the aai-sync.sh seed; authoritative Windows PowerShell 5.1 check).
          $seededCfg = Join-Path $target "docs/ai/update-config.yaml"
          if (-not (Test-Path $seededCfg)) {
            Write-Host "MISSING docs/ai/update-config.yaml (not seeded)"; $fail++
          } elseif (-not (Select-String -Path $seededCfg -Pattern '^mode: notify$' -Quiet)) {
            Write-Host "docs/ai/update-config.yaml seeded without 'mode: notify'"; $fail++
          } else {
            Write-Host "SEEDED docs/ai/update-config.yaml (mode: notify)"
          }
          # Assert nested per-skill SKILL.md copied for BOTH mixed-content dirs
          # (top-level README alongside subfolders) — the exact shape that broke.
          foreach ($d in @(".codex/skills", ".gemini/skills")) {
            $nested = @(Get-ChildItem -Path (Join-Path $target $d) -Recurse -Filter "SKILL.md" -ErrorAction SilentlyContinue).Count
            if ($nested -lt 20) { Write-Host "$d nested SKILL.md too few: $nested"; $fail++ }
            else { Write-Host "$d nested SKILL.md: $nested" }
          }
          if ($fail -gt 0) { Write-Error "functional sync smoke failed ($fail check(s))"; exit 1 }
          Write-Host "SYNC SMOKE OK (.codex + .gemini skills fully populated)"

      - name: Parse-check every .ps1 under Windows PowerShell 5.1
        shell: powershell   # Windows PowerShell 5.1 (the field environment)
        run: |
          $bad = 0
          Get-ChildItem -Path .aai/scripts -Filter *.ps1 | Sort-Object Name | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs -and $errs.Count) {
              $bad++
              Write-Host "PARSEFAIL $($_.Name)"
              $errs | ForEach-Object { Write-Host "  $($_.Message)" }
            } else {
              Write-Host "OK $($_.Name)"
            }
          }
          if ($bad -gt 0) { Write-Error "$bad .ps1 file(s) fail to parse under Windows PowerShell 5.1"; exit 1 }

      - name: Parse-check every .ps1 under pwsh 7
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Path .aai/scripts -Filter *.ps1 | Sort-Object Name | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs -and $errs.Count) { $bad++; Write-Host "PARSEFAIL $($_.Name)"; $errs | ForEach-Object { Write-Host "  $($_.Message)" } }
          }
          if ($bad -gt 0) { Write-Error "$bad .ps1 file(s) fail to parse under pwsh 7"; exit 1 }

      - name: "Prepare real-wrapper smoke fixtures (CHANGE-0133 Spec-AC-05)"
        # LF-only fixture scripts, written once and shared by both engine
        # smoke steps below. Using script FILES (not an inline `sh -c "a; b"`
        # string) sidesteps a real PowerShell footgun proven while building
        # this step: Start-Process -ArgumentList silently space-joins array
        # elements instead of quoting them, so a single argument containing
        # spaces/semicolons arrives at the child as several mis-split words.
        shell: bash
        run: |
          tmp="${RUNNER_TEMP}"
          printf 'echo AAI-WRAPPER-SMOKE-MARKER\nexit 3\n' > "$tmp/aai-smoke-marker.sh"
          printf 'sleep 10\n' > "$tmp/aai-smoke-hang.sh"
          printf 'echo SHOULD-NOT-RUN\n' > "$tmp/aai-smoke-spawnfail.sh"

      - name: "Real-wrapper smoke: aai-run-tests.ps1 under Windows PowerShell 5.1 (CHANGE-0133 Spec-AC-05)"
        # First real end-to-end execution of aai-run-tests.ps1 on a real
        # Windows host (Git Bash present, WSL absent on windows-latest), three
        # arms proving the exit-code contract this scope adds:
        #   success  - exits exactly 3, marker reaches stdout, no
        #              AAI-SPAWN-ERROR line (124/125 semantics unaffected).
        #   timeout  - a command that genuinely hangs past AAI_TEST_TIMEOUT
        #              still exits 124 with no AAI-SPAWN-ERROR (124 keeps its
        #              "ran and was killed" meaning).
        #   spawnfail - a REAL (not mocked) broken Git-Bash interpreter -
        #              the first candidate aai-run-tests.ps1 itself would
        #              resolve is swapped for a non-executable decoy for the
        #              duration of this one arm - makes the "no
        #              AAI-SPAWN-ERROR" checks above non-vacuous: this is the
        #              one arm where the line MUST appear, with exit 125 and
        #              no marker (the process never started).
        #
        # Captured at the OS handle level via Start-Process
        # -RedirectStandardOutput/-RedirectStandardError on the WRAPPER
        # INVOCATION ITSELF (a real child process), never in-process `1>`/`2>`
        # on a dot-invoked script: [Console]::Error (Write-SpawnError) writes
        # the process's real stderr handle and bypasses PowerShell's error
        # stream, so in-process `2>` never sees it and the assertion was
        # always vacuous (proven locally under pwsh before this fix landed).
        shell: powershell   # Windows PowerShell 5.1 (the field environment)
        run: |
          $ErrorActionPreference = "Stop"
          $engine = "powershell.exe"
          $scriptPath = (Resolve-Path ".\.aai\scripts\aai-run-tests.ps1").Path
          $markerScript = Join-Path $env:RUNNER_TEMP "aai-smoke-marker.sh"
          $hangScript = Join-Path $env:RUNNER_TEMP "aai-smoke-hang.sh"
          $spawnfailScript = Join-Path $env:RUNNER_TEMP "aai-smoke-spawnfail.sh"
          $fail = 0

          function Invoke-WrapperSmokeArm {
            param([string]$ArmName, [string[]]$WrapperArgs)
            $outFile = Join-Path $env:RUNNER_TEMP "aai-smoke-51-$ArmName.out"
            $errFile = Join-Path $env:RUNNER_TEMP "aai-smoke-51-$ArmName.err"
            if (Test-Path $outFile) { Remove-Item $outFile -Force }
            if (Test-Path $errFile) { Remove-Item $errFile -Force }
            $psArgs = @('-NoProfile', '-File', ('"' + $scriptPath + '"')) + $WrapperArgs
            $p = Start-Process -FilePath $engine -ArgumentList $psArgs -NoNewWindow -PassThru -Wait `
                  -RedirectStandardOutput $outFile -RedirectStandardError $errFile
            $out = Get-Content $outFile -Raw -ErrorAction SilentlyContinue
            $err = Get-Content $errFile -Raw -ErrorAction SilentlyContinue
            return [pscustomobject]@{ Code = $p.ExitCode; Out = $out; Err = $err }
          }

          function Resolve-RealGitBashForSmoke {
            # Mirrors Get-GitBashCandidates/Find-GitBash's resolution order
            # (read-only re-derivation for the test harness; the production
            # functions in aai-run-tests.ps1 are untouched) so the decoy swap
            # below always targets the SAME file the wrapper would resolve.
            $candidates = @()
            if ($env:ProgramFiles) { $candidates += (Join-Path $env:ProgramFiles 'Git\bin\bash.exe') }
            $pf86 = ${env:ProgramFiles(x86)}
            if ($pf86) { $candidates += (Join-Path $pf86 'Git\bin\bash.exe') }
            $gitCmd = Get-Command git.exe -ErrorAction SilentlyContinue
            if ($gitCmd) {
              try {
                $execPath = & git.exe --exec-path 2>$null
                if ($execPath) {
                  $gitRoot = Split-Path (Split-Path (Split-Path $execPath -Parent) -Parent) -Parent
                  if ($gitRoot) { $candidates += (Join-Path $gitRoot 'bin\bash.exe') }
                }
              } catch {}
            }
            $pathBash = Get-Command bash.exe -ErrorAction SilentlyContinue -All
            if ($pathBash) { foreach ($b in $pathBash) { $candidates += $b.Source } }
            foreach ($c in $candidates) {
              if (-not $c) { continue }
              if ($c -match '(?i)\\System32\\bash\.exe$') { continue }
              if (Test-Path -LiteralPath $c -PathType Leaf) { return $c }
            }
            return $null
          }

          # Arm 1 - success
          $r1 = Invoke-WrapperSmokeArm -ArmName 'success' -WrapperArgs @('sh', ('"' + $markerScript + '"'))
          Write-Host "success: code=$($r1.Code) out=[$($r1.Out)] err=[$($r1.Err)]"
          if ($r1.Code -ne 3) { Write-Host "FAIL success: expected exit 3, got $($r1.Code)"; $fail++ }
          if ($r1.Out -notmatch 'AAI-WRAPPER-SMOKE-MARKER') { Write-Host "FAIL success: missing marker on stdout"; $fail++ }
          if ($r1.Err -match 'AAI-SPAWN-ERROR') { Write-Host "FAIL success: unexpected AAI-SPAWN-ERROR on stderr"; $fail++ }

          # Arm 2 - genuine timeout (124 keeps its own meaning, never 125)
          $env:AAI_TEST_TIMEOUT = "2"
          $r2 = Invoke-WrapperSmokeArm -ArmName 'timeout' -WrapperArgs @('sh', ('"' + $hangScript + '"'))
          Remove-Item Env:\AAI_TEST_TIMEOUT -ErrorAction SilentlyContinue
          Write-Host "timeout: code=$($r2.Code) err=[$($r2.Err)]"
          if ($r2.Code -ne 124) { Write-Host "FAIL timeout: expected exit 124, got $($r2.Code)"; $fail++ }
          if ($r2.Err -match 'AAI-SPAWN-ERROR') { Write-Host "FAIL timeout: unexpected AAI-SPAWN-ERROR on stderr"; $fail++ }

          # Arm 3 - REAL induced spawn failure (non-vacuous AAI-SPAWN-ERROR proof)
          $realBash = Resolve-RealGitBashForSmoke
          if (-not $realBash) {
            Write-Host "FAIL spawnfail: no real Git Bash resolved on this runner (cannot induce a real spawn failure)"
            $fail++
          } else {
            $backupPath = "$realBash.aai-smoke-backup"
            Move-Item -Path $realBash -Destination $backupPath -Force
            Set-Content -Path $realBash -Value "not a real executable (aai-run-tests.ps1 smoke: induced spawn failure)" -NoNewline -Encoding ascii
            try {
              $r3 = Invoke-WrapperSmokeArm -ArmName 'spawnfail' -WrapperArgs @('sh', ('"' + $spawnfailScript + '"'))
            } finally {
              Remove-Item -Path $realBash -Force -ErrorAction SilentlyContinue
              Move-Item -Path $backupPath -Destination $realBash -Force
            }
            Write-Host "spawnfail: code=$($r3.Code) out=[$($r3.Out)] err=[$($r3.Err)]"
            if ($r3.Code -ne 125) { Write-Host "FAIL spawnfail: expected exit 125, got $($r3.Code)"; $fail++ }
            if ($r3.Err -notmatch 'AAI-SPAWN-ERROR') { Write-Host "FAIL spawnfail: expected AAI-SPAWN-ERROR on stderr, got none"; $fail++ }
            if ($r3.Out -match 'AAI-WRAPPER-SMOKE-MARKER') { Write-Host "FAIL spawnfail: marker must NOT appear (process never started)"; $fail++ }
          }

          if ($fail -gt 0) { Write-Error "real-wrapper smoke failed under Windows PowerShell 5.1 ($fail check(s))"; exit 1 }
          Write-Host "REAL-WRAPPER SMOKE OK (Windows PowerShell 5.1): success/timeout/spawnfail all correct"

      - name: "Real-wrapper smoke: aai-run-tests.ps1 under pwsh 7 (CHANGE-0133 Spec-AC-05)"
        # Same three arms as the Windows PowerShell 5.1 step above, engine
        # swapped to pwsh so both engines named in Spec-AC-05 are exercised.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $engine = "pwsh"
          $scriptPath = (Resolve-Path "./.aai/scripts/aai-run-tests.ps1").Path
          $markerScript = Join-Path $env:RUNNER_TEMP "aai-smoke-marker.sh"
          $hangScript = Join-Path $env:RUNNER_TEMP "aai-smoke-hang.sh"
          $spawnfailScript = Join-Path $env:RUNNER_TEMP "aai-smoke-spawnfail.sh"
          $fail = 0

          function Invoke-WrapperSmokeArm {
            param([string]$ArmName, [string[]]$WrapperArgs)
            $outFile = Join-Path $env:RUNNER_TEMP "aai-smoke-pwsh7-$ArmName.out"
            $errFile = Join-Path $env:RUNNER_TEMP "aai-smoke-pwsh7-$ArmName.err"
            if (Test-Path $outFile) { Remove-Item $outFile -Force }
            if (Test-Path $errFile) { Remove-Item $errFile -Force }
            $psArgs = @('-NoProfile', '-File', ('"' + $scriptPath + '"')) + $WrapperArgs
            $p = Start-Process -FilePath $engine -ArgumentList $psArgs -NoNewWindow -PassThru -Wait `
                  -RedirectStandardOutput $outFile -RedirectStandardError $errFile
            $out = Get-Content $outFile -Raw -ErrorAction SilentlyContinue
            $err = Get-Content $errFile -Raw -ErrorAction SilentlyContinue
            return [pscustomobject]@{ Code = $p.ExitCode; Out = $out; Err = $err }
          }

          function Resolve-RealGitBashForSmoke {
            $candidates = @()
            if ($env:ProgramFiles) { $candidates += (Join-Path $env:ProgramFiles 'Git\bin\bash.exe') }
            $pf86 = ${env:ProgramFiles(x86)}
            if ($pf86) { $candidates += (Join-Path $pf86 'Git\bin\bash.exe') }
            $gitCmd = Get-Command git.exe -ErrorAction SilentlyContinue
            if ($gitCmd) {
              try {
                $execPath = & git.exe --exec-path 2>$null
                if ($execPath) {
                  $gitRoot = Split-Path (Split-Path (Split-Path $execPath -Parent) -Parent) -Parent
                  if ($gitRoot) { $candidates += (Join-Path $gitRoot 'bin\bash.exe') }
                }
              } catch {}
            }
            $pathBash = Get-Command bash.exe -ErrorAction SilentlyContinue -All
            if ($pathBash) { foreach ($b in $pathBash) { $candidates += $b.Source } }
            foreach ($c in $candidates) {
              if (-not $c) { continue }
              if ($c -match '(?i)\\System32\\bash\.exe$') { continue }
              if (Test-Path -LiteralPath $c -PathType Leaf) { return $c }
            }
            return $null
          }

          $r1 = Invoke-WrapperSmokeArm -ArmName 'success' -WrapperArgs @('sh', ('"' + $markerScript + '"'))
          Write-Host "success: code=$($r1.Code) out=[$($r1.Out)] err=[$($r1.Err)]"
          if ($r1.Code -ne 3) { Write-Host "FAIL success: expected exit 3, got $($r1.Code)"; $fail++ }
          if ($r1.Out -notmatch 'AAI-WRAPPER-SMOKE-MARKER') { Write-Host "FAIL success: missing marker on stdout"; $fail++ }
          if ($r1.Err -match 'AAI-SPAWN-ERROR') { Write-Host "FAIL success: unexpected AAI-SPAWN-ERROR on stderr"; $fail++ }

          $env:AAI_TEST_TIMEOUT = "2"
          $r2 = Invoke-WrapperSmokeArm -ArmName 'timeout' -WrapperArgs @('sh', ('"' + $hangScript + '"'))
          Remove-Item Env:\AAI_TEST_TIMEOUT -ErrorAction SilentlyContinue
          Write-Host "timeout: code=$($r2.Code) err=[$($r2.Err)]"
          if ($r2.Code -ne 124) { Write-Host "FAIL timeout: expected exit 124, got $($r2.Code)"; $fail++ }
          if ($r2.Err -match 'AAI-SPAWN-ERROR') { Write-Host "FAIL timeout: unexpected AAI-SPAWN-ERROR on stderr"; $fail++ }

          $realBash = Resolve-RealGitBashForSmoke
          if (-not $realBash) {
            Write-Host "FAIL spawnfail: no real Git Bash resolved on this runner (cannot induce a real spawn failure)"
            $fail++
          } else {
            $backupPath = "$realBash.aai-smoke-backup"
            Move-Item -Path $realBash -Destination $backupPath -Force
            Set-Content -Path $realBash -Value "not a real executable (aai-run-tests.ps1 smoke: induced spawn failure)" -NoNewline -Encoding ascii
            try {
              $r3 = Invoke-WrapperSmokeArm -ArmName 'spawnfail' -WrapperArgs @('sh', ('"' + $spawnfailScript + '"'))
            } finally {
              Remove-Item -Path $realBash -Force -ErrorAction SilentlyContinue
              Move-Item -Path $backupPath -Destination $realBash -Force
            }
            Write-Host "spawnfail: code=$($r3.Code) out=[$($r3.Out)] err=[$($r3.Err)]"
            if ($r3.Code -ne 125) { Write-Host "FAIL spawnfail: expected exit 125, got $($r3.Code)"; $fail++ }
            if ($r3.Err -notmatch 'AAI-SPAWN-ERROR') { Write-Host "FAIL spawnfail: expected AAI-SPAWN-ERROR on stderr, got none"; $fail++ }
            if ($r3.Out -match 'AAI-WRAPPER-SMOKE-MARKER') { Write-Host "FAIL spawnfail: marker must NOT appear (process never started)"; $fail++ }
          }

          if ($fail -gt 0) { Write-Error "real-wrapper smoke failed under pwsh 7 ($fail check(s))"; exit 1 }
          Write-Host "REAL-WRAPPER SMOKE OK (pwsh 7): success/timeout/spawnfail all correct"
