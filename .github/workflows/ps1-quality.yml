name: ps1-quality
# Schedule-only canary marker (CHANGE-0136 Spec-AC-04): on schedule events the
# run is named as the weekly image-drift canary so a scheduled failure is
# visually distinguishable from PR noise in the Actions list; every other
# event yields an empty string, which GitHub replaces with the default name.
run-name: ${{ github.event_name == 'schedule' && 'ps1-quality weekly runner-image-drift canary (scheduled)' || '' }}

# Guards the vendored PowerShell scripts (.aai/scripts/*.ps1) against the class of
# failure that broke /aai-update: a parse error that only surfaces when a user
# runs the script. Two jobs:
#   - gate:          the full bash quality gate on Linux (parse-check + PSScript-
#                    Analyzer 5.1/7.0 syntax compat + Pester smoke tests) under pwsh 7.
#   - windows-5_1:   parse-check every .ps1 under REAL Windows PowerShell 5.1 —
#                    the actual environment that broke — plus pwsh 7, a
#                    functional aai-sync.ps1 smoke into a fresh target (catches
#                    runtime copy behavior a parse check cannot, e.g. the
#                    Copy-Item DirectoryNotFoundException on .codex/skills),
#                    AND (CHANGE-0134) the SAME full tests/skills Pester
#                    discovery the `gate` job runs on Linux, executed under
#                    BOTH Windows PowerShell 5.1 and pwsh 7, so an
#                    engine-specific runtime semantic (SPEC-0120's 5.1
#                    ExitCode-null footgun class of defect) fails as a named
#                    unit test in the same job that already proves the
#                    scripts parse, instead of surfacing only after a blind
#                    ~10-minute e2e iteration.
#
# Fast-iteration path (CHANGE-0134 Spec-AC-04): this runs the whole
# ps1-quality workflow (both `gate` and `windows-5_1`) via workflow_dispatch,
# on demand and without opening a PR:
#   gh workflow run ps1-quality.yml
# GitHub Actions has no single-job dispatch, so `gate` runs too.
# `workflow_dispatch` is wired below; this note exists so the next Windows
# debugging session does not have to rediscover it.
#
# CHANGE-0136 closes three CI platform blind spots on top of the jobs above:
#   - windows-wsl1:  a NEW sibling job that installs a real WSL1 Debian distro
#                    (Vampire/setup-wsl, pinned major) and proves, live, what
#                    windows-latest's distro-less wsl.exe never could: the
#                    wrapper's WSL branch (AAI-BRANCH: WSL), the vendored
#                    selftest's three arms with WSL semantics (marker written
#                    through the payload wslpath translation, timeout 124,
#                    spawnfail 125 via the decoy with wsl.exe hidden), and the
#                    full 5.1 Pester suite with WSL usable. HONESTY (WSL1 vs
#                    WSL2): GitHub-hosted Windows runners cannot run WSL2 at
#                    all — no nested virtualization — so this leg proves WSL1
#                    ONLY; WSL2-specific failure classes (e.g. E_ACCESSDENIED)
#                    remain field-only (SPEC-0046 MV-1..MV-3). The existing
#                    windows-5_1 job keeps its zero-distro no-WSL semantics
#                    untouched on its own VM (a distro install is host-global).
#   - windows-5_1:   gains a 5.1-only step that hides pwsh from a doctored
#                    CHILD environment's PATH (nothing on the host is ever
#                    uninstalled or renamed) to prove the prefer-pwsh-else-
#                    powershell fallbacks take the powershell.exe arm for real.
#   - schedule:      a weekly cron (Mondays 05:00 UTC) turns a runner-image
#                    update (Git Bash / Pester / pwsh / WSL) into a named
#                    canary failure instead of breaking the next unrelated PR;
#                    the run-name above marks scheduled runs as the canary.

on:
  push:
    branches: [main]
    paths:
      - '.aai/scripts/**.ps1'
      - '.aai/scripts/PSScriptAnalyzerSettings.psd1'
      - '.aai/scripts/aai-run-tests.sh'
      - 'tests/skills/test-ps1-quality.sh'
      - 'tests/skills/*.Tests.ps1'
      - 'tests/skills/lib/**'
      - '.github/workflows/ps1-quality.yml'
  pull_request:
    paths:
      - '.aai/scripts/**.ps1'
      - '.aai/scripts/PSScriptAnalyzerSettings.psd1'
      - '.aai/scripts/aai-run-tests.sh'
      - 'tests/skills/test-ps1-quality.sh'
      - 'tests/skills/*.Tests.ps1'
      - 'tests/skills/lib/**'
      - '.github/workflows/ps1-quality.yml'
  workflow_dispatch: {}
  schedule:
    # CHANGE-0136 Spec-AC-04: weekly runner-image-drift canary — Mondays
    # 05:00 UTC, before the CET workday. See the run-name expression at the
    # top for how a scheduled run is marked in the Actions list.
    - cron: '0 5 * * 1'

permissions:
  contents: read

env:
  # CHANGE-0134 Spec-AC-02: declared exactly ONCE so every consumer step
  # asserts the identical expected skip count (SEAM-1) — a per-step literal
  # would let the engines silently drift apart. Count derives from the four
  # named Windows-fragile tests this scope skips: aai-win-dispatch.Tests.ps1's
  # TEST-004 real-invocation arm, CHANGE-0133 TEST-003 (dual-casing
  # environment), the CR-1 H3 grandchild probe, and aai-update.Tests.ps1's
  # TEST-009 (file:// clone).
  # CHANGE-0136 Spec-AC-02: moved from windows-5_1's job level to WORKFLOW
  # level — both windows jobs consume it and test_017 pins the single
  # declaration. The count 4 is re-derived valid for the WSL-usable
  # windows-wsl1 leg too: every PosixOnly skip predicate is host-OS-driven
  # (Test-IsWindowsHostFor), none is WSL-state-driven. If the legs' counts
  # ever diverge, the pin goes per-leg — the count is never loosened.
  AAI_EXPECTED_WIN_SKIP_COUNT: "4"

jobs:
  gate:
    name: ps1 gate (Linux, pwsh 7 + PSScriptAnalyzer + Pester)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules
          key: ps-modules-${{ runner.os }}-pssa1.25-pester5

      - name: Install PSScriptAnalyzer + Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module PSScriptAnalyzer -ListAvailable)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          if (-not (Get-Module Pester -ListAvailable | Where-Object { $_.Version.Major -ge 5 })) {
            Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck
          }
          "PSScriptAnalyzer $((Get-Module PSScriptAnalyzer -ListAvailable | Select-Object -First 1).Version)"
          "Pester $((Get-Module Pester -ListAvailable | Sort-Object Version -Descending | Select-Object -First 1).Version)"

      - name: Run ps1-quality gate
        shell: bash
        run: |
          set +e
          bash tests/skills/test-ps1-quality.sh
          rc=$?
          # 0 = pass, 1 = fail, 42 = skipped (pwsh missing — should not happen here).
          if [ "$rc" -eq 42 ]; then
            echo "::warning::ps1-quality gate skipped (pwsh unexpectedly unavailable)"
            exit 0
          fi
          exit "$rc"

  windows-5_1:
    name: parse-check + functional sync smoke + full Pester suite (both engines)
    runs-on: windows-latest
    # NB (CHANGE-0136): the expected-skip-count declaration this job consumes
    # moved to WORKFLOW-level env above — declared once, consumed by both
    # windows jobs' Pester run steps.
    steps:
      - uses: actions/checkout@v4

      - name: Functional sync smoke under Windows PowerShell 5.1 (fresh target)
        # Runs the REAL aai-sync.ps1 into a fresh target on Windows PowerShell 5.1
        # — the exact environment + operation that broke a field install with
        # "Copy-Item ... DirectoryNotFoundException" on .codex/skills. A parse
        # check cannot catch a runtime copy behavior; this can. Asserts the
        # agent-skill dirs that mix a top-level README with subfolders are fully
        # populated (they exercise Copy-Replace's create-dest-then-copy path).
        shell: powershell   # Windows PowerShell 5.1 (the field environment)
        run: |
          $ErrorActionPreference = "Stop"
          $target = Join-Path $env:RUNNER_TEMP "aai-sync-smoke"
          if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          git init -q $target
          & .\.aai\scripts\aai-sync.ps1 -TargetRoot $target -Profile extended
          $fail = 0
          foreach ($p in @(".codex/skills/README.md", ".gemini/skills/README.md")) {
            if (-not (Test-Path (Join-Path $target $p))) { Write-Host "MISSING $p"; $fail++ }
          }
          # CHANGE seed-update-config: a fresh sync must SEED the auto-update
          # policy file so the `auto` opt-in knob is discoverable (parity with
          # the aai-sync.sh seed; authoritative Windows PowerShell 5.1 check).
          $seededCfg = Join-Path $target "docs/ai/update-config.yaml"
          if (-not (Test-Path $seededCfg)) {
            Write-Host "MISSING docs/ai/update-config.yaml (not seeded)"; $fail++
          } elseif (-not (Select-String -Path $seededCfg -Pattern '^mode: notify$' -Quiet)) {
            Write-Host "docs/ai/update-config.yaml seeded without 'mode: notify'"; $fail++
          } else {
            Write-Host "SEEDED docs/ai/update-config.yaml (mode: notify)"
          }
          # Assert nested per-skill SKILL.md copied for BOTH mixed-content dirs
          # (top-level README alongside subfolders) — the exact shape that broke.
          foreach ($d in @(".codex/skills", ".gemini/skills")) {
            $nested = @(Get-ChildItem -Path (Join-Path $target $d) -Recurse -Filter "SKILL.md" -ErrorAction SilentlyContinue).Count
            if ($nested -lt 20) { Write-Host "$d nested SKILL.md too few: $nested"; $fail++ }
            else { Write-Host "$d nested SKILL.md: $nested" }
          }
          if ($fail -gt 0) { Write-Error "functional sync smoke failed ($fail check(s))"; exit 1 }
          Write-Host "SYNC SMOKE OK (.codex + .gemini skills fully populated)"

      - name: Parse-check every .ps1 under Windows PowerShell 5.1
        shell: powershell   # Windows PowerShell 5.1 (the field environment)
        run: |
          $bad = 0
          Get-ChildItem -Path .aai/scripts -Filter *.ps1 | Sort-Object Name | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs -and $errs.Count) {
              $bad++
              Write-Host "PARSEFAIL $($_.Name)"
              $errs | ForEach-Object { Write-Host "  $($_.Message)" }
            } else {
              Write-Host "OK $($_.Name)"
            }
          }
          if ($bad -gt 0) { Write-Error "$bad .ps1 file(s) fail to parse under Windows PowerShell 5.1"; exit 1 }

      - name: Parse-check every .ps1 under pwsh 7
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Path .aai/scripts -Filter *.ps1 | Sort-Object Name | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs -and $errs.Count) { $bad++; Write-Host "PARSEFAIL $($_.Name)"; $errs | ForEach-Object { Write-Host "  $($_.Message)" } }
          }
          if ($bad -gt 0) { Write-Error "$bad .ps1 file(s) fail to parse under pwsh 7"; exit 1 }

      - name: "Prepare real-wrapper smoke fixtures (CHANGE-0133 Spec-AC-05)"
        # LF-only fixture scripts, written once and shared by both engine
        # smoke steps below. Using script FILES (not an inline `sh -c "a; b"`
        # string) sidesteps a real PowerShell footgun proven while building
        # this step: Start-Process -ArgumentList silently space-joins array
        # elements instead of quoting them, so a single argument containing
        # spaces/semicolons arrives at the child as several mis-split words.
        shell: bash
        run: |
          tmp="${RUNNER_TEMP}"
          # Iteration-3 hardening (PR #247 run 31606986703): the marker is
          # asserted via a FILE the arm writes to (path handed in through
          # AAI_SMOKE_MARKER_FILE), never via a stdout regex. The prior stdout-
          # only marker was proven encoding-fragile: a leaked UTF-16LE probe
          # message earlier in the SAME stdout stream flips Get-Content's BOM
          # auto-detection for the whole file, silently corrupting the ASCII
          # marker text downstream of it. The stdout echo is kept too (cheap,
          # useful for the diagnostic line below) but is no longer load-bearing.
          printf 'echo AAI-WRAPPER-SMOKE-MARKER\necho AAI-WRAPPER-SMOKE-MARKER > "$AAI_SMOKE_MARKER_FILE"\nexit 3\n' > "$tmp/aai-smoke-marker.sh"
          # Field fact (PR #247 run 31603532721): the timeout arm returned 0
          # instead of 124 -- the fixture must hang UNCONDITIONALLY, with a
          # duration that cannot plausibly elapse (300s vs. the arm's
          # AAI_TEST_TIMEOUT=2 + outer watchdog grace). `sleep 300` has no
          # `read`/tty dependency and no EOF-on-stdin escape hatch.
          printf 'sleep 300\n' > "$tmp/aai-smoke-hang.sh"
          printf 'echo SHOULD-NOT-RUN\n' > "$tmp/aai-smoke-spawnfail.sh"

      - name: "Real-wrapper smoke: aai-run-tests.ps1 under Windows PowerShell 5.1 (CHANGE-0133 Spec-AC-05)"
        # First real end-to-end execution of aai-run-tests.ps1 on a real
        # Windows host (Git Bash present, WSL absent on windows-latest), three
        # arms proving the exit-code contract this scope adds:
        #   success  - exits exactly 3, marker FILE exists with the expected
        #              content (see the file-vs-stdout note below), no
        #              AAI-SPAWN-ERROR line (124/125 semantics unaffected).
        #   timeout  - a command that genuinely hangs past AAI_TEST_TIMEOUT
        #              still exits 124 with no AAI-SPAWN-ERROR (124 keeps its
        #              "ran and was killed" meaning).
        #   spawnfail - a REAL (not mocked) broken Git-Bash interpreter -
        #              the first candidate aai-run-tests.ps1 itself would
        #              resolve is swapped for a non-executable decoy for the
        #              duration of this one arm - makes the "no
        #              AAI-SPAWN-ERROR" checks above non-vacuous: this is the
        #              one arm where the line MUST appear, with exit 125 and
        #              no marker file (the process never started).
        #
        # Captured at the OS handle level via Start-Process
        # -RedirectStandardOutput/-RedirectStandardError on the WRAPPER
        # INVOCATION ITSELF (a real child process), never in-process `1>`/`2>`
        # on a dot-invoked script: [Console]::Error (Write-SpawnError) writes
        # the process's real stderr handle and bypasses PowerShell's error
        # stream, so in-process `2>` never sees it and the assertion was
        # always vacuous (proven locally under pwsh before this fix landed).
        #
        # Iteration-3 hardening (PR #247 run 31606986703), two field defects:
        #   H1 (encoding): the marker is now asserted from a FILE the arm
        #     writes to (AAI_SMOKE_MARKER_FILE), not a stdout regex -- a
        #     leaked UTF-16LE probe message earlier in the same stdout stream
        #     was proven to flip Get-Content's BOM auto-detection for the
        #     WHOLE captured file, silently corrupting real ASCII/UTF-8 text
        #     written after it (fixed at the source too: aai-run-tests.ps1's
        #     Start-WslProbeProcess now redirects its own stdout/stderr to
        #     temp files, never the caller's inherited streams -- but this
        #     assertion no longer depends on that being true).
        #   H3 (timeout not honored): arm2 field evidence (run
        #     31606986703) shows AAI_TEST_TIMEOUT=2 never reached the
        #     wrapper -- it ran to the DEFAULT 300s watchdog and only exited 0
        #     because `sleep 300` outraced it naturally. A Pester probe
        #     (aai-win-dispatch.Tests.ps1, "H3 ... investigation") proves
        #     Set-CanonicalProcessEnvironment itself does NOT drop an
        #     unrelated process-scope var, even across a genuine Path/PATH
        #     collision -- so the loss was happening upstream, in THIS
        #     harness's own ambient env -> Start-Process -> child inheritance
        #     hop. Fixed at cause here: every var the wrapper process needs
        #     (AAI_TEST_TIMEOUT, AAI_SMOKE_MARKER_FILE) is now set INSIDE the
        #     spawned engine's own -Command script text, in the SAME process
        #     that reads it -- never relying on cross-process inheritance for
        #     it. (`exit N` inside a script invoked via `&` from -Command
        #     does NOT become the process's own exit code unless followed by
        #     `exit $LASTEXITCODE` -- verified locally; New-SmokeCommandText
        #     always appends it, preserving the 3/124/125 contract byte-for-
        #     byte.)
        shell: powershell   # Windows PowerShell 5.1 (the field environment)
        run: |
          $ErrorActionPreference = "Stop"
          $engine = "powershell.exe"
          $scriptPath = (Resolve-Path ".\.aai\scripts\aai-run-tests.ps1").Path
          $markerScript = Join-Path $env:RUNNER_TEMP "aai-smoke-marker.sh"
          $hangScript = Join-Path $env:RUNNER_TEMP "aai-smoke-hang.sh"
          $spawnfailScript = Join-Path $env:RUNNER_TEMP "aai-smoke-spawnfail.sh"
          $markerFile = Join-Path $env:RUNNER_TEMP "aai-smoke-51-success.marker"
          $fail = 0

          function New-SmokeCommandText {
            # Builds a -Command script string that sets $ExtraEnv INSIDE the
            # spawned engine's own process, then invokes the wrapper via the
            # call operator, then propagates its real exit code explicitly.
            # See the H3 hardening note above the step header for why this
            # replaces ambient parent->child env inheritance across the
            # Start-Process boundary.
            param(
              [Parameter(Mandatory)][string]$ScriptPath,
              [Parameter(Mandatory)][string[]]$WrapperArgs,
              [hashtable]$ExtraEnv
            )
            $sb = [System.Text.StringBuilder]::new()
            if ($ExtraEnv) {
              foreach ($k in $ExtraEnv.Keys) {
                $v = ([string]$ExtraEnv[$k]) -replace "'", "''"
                [void]$sb.Append("`$env:$k = '$v'; ")
              }
            }
            $q = { param($s) "'" + ($s -replace "'", "''") + "'" }
            [void]$sb.Append('& ' + (& $q $ScriptPath))
            foreach ($a in $WrapperArgs) { [void]$sb.Append(' ' + (& $q $a)) }
            [void]$sb.Append('; exit $LASTEXITCODE')
            return $sb.ToString()
          }

          function Get-SmokeDiagBranch {
            # PR #247 iter-4: the wrapper now prints an unconditional
            # "AAI-BRANCH: <Branch> | AAI-TIMEOUT: <N>s (source=env|default)"
            # line on every non-error run (Write-BranchDiag in
            # aai-run-tests.ps1), so a SUCCESSFUL arm no longer has to fall
            # back to "unknown" -- only the spawn-error and env-error paths
            # still need their own patterns (AAI-BRANCH is never emitted on
            # those, by the wrapper's own Spec-AC-02/03 single-line contracts).
            param([string]$Err)
            if ($Err -match 'AAI-BRANCH:\s*([^|]+?)\s*\|') { return $Matches[1].Trim() }
            if ($Err -match 'AAI-SPAWN-ERROR:\s*\[([^\]]+)\]') { return $Matches[1] }
            if ($Err -match 'AAI-ENV-ERROR') { return 'none (env-error)' }
            return 'unknown (no branch marker on stderr)'
          }

          function Invoke-WrapperSmokeArm {
            param([string]$ArmName, [string[]]$WrapperArgs, [hashtable]$ExtraEnv)
            $outFile = Join-Path $env:RUNNER_TEMP "aai-smoke-51-$ArmName.out"
            $errFile = Join-Path $env:RUNNER_TEMP "aai-smoke-51-$ArmName.err"
            if (Test-Path $outFile) { Remove-Item $outFile -Force }
            if (Test-Path $errFile) { Remove-Item $errFile -Force }
            $commandText = New-SmokeCommandText -ScriptPath $scriptPath -WrapperArgs $WrapperArgs -ExtraEnv $ExtraEnv
            $psArgs = @('-NoProfile', '-Command', $commandText)
            $p = Start-Process -FilePath $engine -ArgumentList $psArgs -NoNewWindow -PassThru -Wait `
                  -RedirectStandardOutput $outFile -RedirectStandardError $errFile
            $out = Get-Content $outFile -Raw -ErrorAction SilentlyContinue
            $err = Get-Content $errFile -Raw -ErrorAction SilentlyContinue
            $result = [pscustomobject]@{ Code = $p.ExitCode; Out = $out; Err = $err }
            $branch = Get-SmokeDiagBranch -Err $result.Err
            $out80 = if ($result.Out) { $result.Out.Substring(0, [Math]::Min(80, $result.Out.Length)) } else { '' }
            $err80 = if ($result.Err) { $result.Err.Substring(0, [Math]::Min(80, $result.Err.Length)) } else { '' }
            Write-Host "diag[$ArmName]: branch=$branch out80=[$out80] err80=[$err80]"
            return $result
          }

          function Resolve-RealGitBashForSmoke {
            # Mirrors Get-GitBashCandidates/Find-GitBash's resolution order
            # (read-only re-derivation for the test harness; the production
            # functions in aai-run-tests.ps1 are untouched) so the decoy swap
            # below always targets the SAME file the wrapper would resolve.
            $candidates = @()
            if ($env:ProgramFiles) { $candidates += (Join-Path $env:ProgramFiles 'Git\bin\bash.exe') }
            $pf86 = ${env:ProgramFiles(x86)}
            if ($pf86) { $candidates += (Join-Path $pf86 'Git\bin\bash.exe') }
            $gitCmd = Get-Command git.exe -ErrorAction SilentlyContinue
            if ($gitCmd) {
              try {
                $execPath = & git.exe --exec-path 2>$null
                if ($execPath) {
                  $gitRoot = Split-Path (Split-Path (Split-Path $execPath -Parent) -Parent) -Parent
                  if ($gitRoot) { $candidates += (Join-Path $gitRoot 'bin\bash.exe') }
                }
              } catch {}
            }
            $pathBash = Get-Command bash.exe -ErrorAction SilentlyContinue -All
            if ($pathBash) { foreach ($b in $pathBash) { $candidates += $b.Source } }
            foreach ($c in $candidates) {
              if (-not $c) { continue }
              if ($c -match '(?i)\\System32\\bash\.exe$') { continue }
              if (Test-Path -LiteralPath $c -PathType Leaf) { return $c }
            }
            return $null
          }

          # Arm 1 - success
          if (Test-Path $markerFile) { Remove-Item $markerFile -Force }
          $r1 = Invoke-WrapperSmokeArm -ArmName 'success' -WrapperArgs @('sh', $markerScript) -ExtraEnv @{ AAI_SMOKE_MARKER_FILE = $markerFile }
          Write-Host "success: code=$($r1.Code) out=[$($r1.Out)] err=[$($r1.Err)]"
          if ($r1.Code -ne 3) { Write-Host "FAIL success: expected exit 3, got $($r1.Code)"; $fail++ }
          if (-not (Test-Path $markerFile)) {
            Write-Host "FAIL success: marker file was not created: $markerFile"; $fail++
          } elseif ((Get-Content -LiteralPath $markerFile -Raw -ErrorAction SilentlyContinue) -notmatch 'AAI-WRAPPER-SMOKE-MARKER') {
            Write-Host "FAIL success: marker file exists but lacks expected content"; $fail++
          }
          if ($r1.Err -match 'AAI-SPAWN-ERROR') { Write-Host "FAIL success: unexpected AAI-SPAWN-ERROR on stderr"; $fail++ }

          # Arm 2 - genuine timeout (124 keeps its own meaning, never 125)
          $r2 = Invoke-WrapperSmokeArm -ArmName 'timeout' -WrapperArgs @('sh', $hangScript) -ExtraEnv @{ AAI_TEST_TIMEOUT = '2' }
          Write-Host "timeout: code=$($r2.Code) err=[$($r2.Err)]"
          if ($r2.Code -ne 124) { Write-Host "FAIL timeout: expected exit 124, got $($r2.Code)"; $fail++ }
          if ($r2.Err -match 'AAI-SPAWN-ERROR') { Write-Host "FAIL timeout: unexpected AAI-SPAWN-ERROR on stderr"; $fail++ }

          # Arm 3 - REAL induced spawn failure (non-vacuous AAI-SPAWN-ERROR proof)
          $realBash = Resolve-RealGitBashForSmoke
          if (-not $realBash) {
            Write-Host "FAIL spawnfail: no real Git Bash resolved on this runner (cannot induce a real spawn failure)"
            $fail++
          } else {
            $backupPath = "$realBash.aai-smoke-backup"
            Move-Item -Path $realBash -Destination $backupPath -Force
            Set-Content -Path $realBash -Value "not a real executable (aai-run-tests.ps1 smoke: induced spawn failure)" -NoNewline -Encoding ascii
            try {
              $r3 = Invoke-WrapperSmokeArm -ArmName 'spawnfail' -WrapperArgs @('sh', $spawnfailScript)
            } finally {
              Remove-Item -Path $realBash -Force -ErrorAction SilentlyContinue
              Move-Item -Path $backupPath -Destination $realBash -Force
            }
            Write-Host "spawnfail: code=$($r3.Code) out=[$($r3.Out)] err=[$($r3.Err)]"
            if ($r3.Code -ne 125) { Write-Host "FAIL spawnfail: expected exit 125, got $($r3.Code)"; $fail++ }
            if ($r3.Err -notmatch 'AAI-SPAWN-ERROR') { Write-Host "FAIL spawnfail: expected AAI-SPAWN-ERROR on stderr, got none"; $fail++ }
            if ($r3.Out -match 'AAI-WRAPPER-SMOKE-MARKER') { Write-Host "FAIL spawnfail: marker must NOT appear (process never started)"; $fail++ }
            if ($r3.Out -match 'SHOULD-NOT-RUN') { Write-Host "FAIL spawnfail: fixture RAN (SHOULD-NOT-RUN captured) - 125 did not come from a pre-spawn failure"; $fail++ }
          }

          if ($fail -gt 0) { Write-Error "real-wrapper smoke failed under Windows PowerShell 5.1 ($fail check(s))"; exit 1 }
          Write-Host "REAL-WRAPPER SMOKE OK (Windows PowerShell 5.1): success/timeout/spawnfail all correct"

      - name: "Real-wrapper smoke: aai-run-tests.ps1 under pwsh 7 (CHANGE-0133 Spec-AC-05)"
        # Same three arms as the Windows PowerShell 5.1 step above, engine
        # swapped to pwsh so both engines named in Spec-AC-05 are exercised.
        # H1/H3 hardening (PR #247 run 31606986703): kept byte-for-byte in
        # sync with the Windows PowerShell 5.1 step above -- see its header
        # comment for the full rationale (file-based marker assertion,
        # env-vars-set-inside-the-spawned-process instead of relying on
        # ambient Start-Process inheritance, exit-code fidelity via explicit
        # `exit $LASTEXITCODE`).
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $engine = "pwsh"
          $scriptPath = (Resolve-Path "./.aai/scripts/aai-run-tests.ps1").Path
          $markerScript = Join-Path $env:RUNNER_TEMP "aai-smoke-marker.sh"
          $hangScript = Join-Path $env:RUNNER_TEMP "aai-smoke-hang.sh"
          $spawnfailScript = Join-Path $env:RUNNER_TEMP "aai-smoke-spawnfail.sh"
          $markerFile = Join-Path $env:RUNNER_TEMP "aai-smoke-pwsh7-success.marker"
          $fail = 0

          function New-SmokeCommandText {
            param(
              [Parameter(Mandatory)][string]$ScriptPath,
              [Parameter(Mandatory)][string[]]$WrapperArgs,
              [hashtable]$ExtraEnv
            )
            $sb = [System.Text.StringBuilder]::new()
            if ($ExtraEnv) {
              foreach ($k in $ExtraEnv.Keys) {
                $v = ([string]$ExtraEnv[$k]) -replace "'", "''"
                [void]$sb.Append("`$env:$k = '$v'; ")
              }
            }
            $q = { param($s) "'" + ($s -replace "'", "''") + "'" }
            [void]$sb.Append('& ' + (& $q $ScriptPath))
            foreach ($a in $WrapperArgs) { [void]$sb.Append(' ' + (& $q $a)) }
            [void]$sb.Append('; exit $LASTEXITCODE')
            return $sb.ToString()
          }

          function Get-SmokeDiagBranch {
            # PR #247 iter-4: mirrors the Windows PowerShell 5.1 step above --
            # see its Get-SmokeDiagBranch comment for the full rationale.
            param([string]$Err)
            if ($Err -match 'AAI-BRANCH:\s*([^|]+?)\s*\|') { return $Matches[1].Trim() }
            if ($Err -match 'AAI-SPAWN-ERROR:\s*\[([^\]]+)\]') { return $Matches[1] }
            if ($Err -match 'AAI-ENV-ERROR') { return 'none (env-error)' }
            return 'unknown (no branch marker on stderr)'
          }

          function Invoke-WrapperSmokeArm {
            param([string]$ArmName, [string[]]$WrapperArgs, [hashtable]$ExtraEnv)
            $outFile = Join-Path $env:RUNNER_TEMP "aai-smoke-pwsh7-$ArmName.out"
            $errFile = Join-Path $env:RUNNER_TEMP "aai-smoke-pwsh7-$ArmName.err"
            if (Test-Path $outFile) { Remove-Item $outFile -Force }
            if (Test-Path $errFile) { Remove-Item $errFile -Force }
            $commandText = New-SmokeCommandText -ScriptPath $scriptPath -WrapperArgs $WrapperArgs -ExtraEnv $ExtraEnv
            $psArgs = @('-NoProfile', '-Command', $commandText)
            $p = Start-Process -FilePath $engine -ArgumentList $psArgs -NoNewWindow -PassThru -Wait `
                  -RedirectStandardOutput $outFile -RedirectStandardError $errFile
            $out = Get-Content $outFile -Raw -ErrorAction SilentlyContinue
            $err = Get-Content $errFile -Raw -ErrorAction SilentlyContinue
            $result = [pscustomobject]@{ Code = $p.ExitCode; Out = $out; Err = $err }
            $branch = Get-SmokeDiagBranch -Err $result.Err
            $out80 = if ($result.Out) { $result.Out.Substring(0, [Math]::Min(80, $result.Out.Length)) } else { '' }
            $err80 = if ($result.Err) { $result.Err.Substring(0, [Math]::Min(80, $result.Err.Length)) } else { '' }
            Write-Host "diag[$ArmName]: branch=$branch out80=[$out80] err80=[$err80]"
            return $result
          }

          function Resolve-RealGitBashForSmoke {
            $candidates = @()
            if ($env:ProgramFiles) { $candidates += (Join-Path $env:ProgramFiles 'Git\bin\bash.exe') }
            $pf86 = ${env:ProgramFiles(x86)}
            if ($pf86) { $candidates += (Join-Path $pf86 'Git\bin\bash.exe') }
            $gitCmd = Get-Command git.exe -ErrorAction SilentlyContinue
            if ($gitCmd) {
              try {
                $execPath = & git.exe --exec-path 2>$null
                if ($execPath) {
                  $gitRoot = Split-Path (Split-Path (Split-Path $execPath -Parent) -Parent) -Parent
                  if ($gitRoot) { $candidates += (Join-Path $gitRoot 'bin\bash.exe') }
                }
              } catch {}
            }
            $pathBash = Get-Command bash.exe -ErrorAction SilentlyContinue -All
            if ($pathBash) { foreach ($b in $pathBash) { $candidates += $b.Source } }
            foreach ($c in $candidates) {
              if (-not $c) { continue }
              if ($c -match '(?i)\\System32\\bash\.exe$') { continue }
              if (Test-Path -LiteralPath $c -PathType Leaf) { return $c }
            }
            return $null
          }

          if (Test-Path $markerFile) { Remove-Item $markerFile -Force }
          $r1 = Invoke-WrapperSmokeArm -ArmName 'success' -WrapperArgs @('sh', $markerScript) -ExtraEnv @{ AAI_SMOKE_MARKER_FILE = $markerFile }
          Write-Host "success: code=$($r1.Code) out=[$($r1.Out)] err=[$($r1.Err)]"
          if ($r1.Code -ne 3) { Write-Host "FAIL success: expected exit 3, got $($r1.Code)"; $fail++ }
          if (-not (Test-Path $markerFile)) {
            Write-Host "FAIL success: marker file was not created: $markerFile"; $fail++
          } elseif ((Get-Content -LiteralPath $markerFile -Raw -ErrorAction SilentlyContinue) -notmatch 'AAI-WRAPPER-SMOKE-MARKER') {
            Write-Host "FAIL success: marker file exists but lacks expected content"; $fail++
          }
          if ($r1.Err -match 'AAI-SPAWN-ERROR') { Write-Host "FAIL success: unexpected AAI-SPAWN-ERROR on stderr"; $fail++ }

          $r2 = Invoke-WrapperSmokeArm -ArmName 'timeout' -WrapperArgs @('sh', $hangScript) -ExtraEnv @{ AAI_TEST_TIMEOUT = '2' }
          Write-Host "timeout: code=$($r2.Code) err=[$($r2.Err)]"
          if ($r2.Code -ne 124) { Write-Host "FAIL timeout: expected exit 124, got $($r2.Code)"; $fail++ }
          if ($r2.Err -match 'AAI-SPAWN-ERROR') { Write-Host "FAIL timeout: unexpected AAI-SPAWN-ERROR on stderr"; $fail++ }

          $realBash = Resolve-RealGitBashForSmoke
          if (-not $realBash) {
            Write-Host "FAIL spawnfail: no real Git Bash resolved on this runner (cannot induce a real spawn failure)"
            $fail++
          } else {
            $backupPath = "$realBash.aai-smoke-backup"
            Move-Item -Path $realBash -Destination $backupPath -Force
            Set-Content -Path $realBash -Value "not a real executable (aai-run-tests.ps1 smoke: induced spawn failure)" -NoNewline -Encoding ascii
            try {
              $r3 = Invoke-WrapperSmokeArm -ArmName 'spawnfail' -WrapperArgs @('sh', $spawnfailScript)
            } finally {
              Remove-Item -Path $realBash -Force -ErrorAction SilentlyContinue
              Move-Item -Path $backupPath -Destination $realBash -Force
            }
            Write-Host "spawnfail: code=$($r3.Code) out=[$($r3.Out)] err=[$($r3.Err)]"
            if ($r3.Code -ne 125) { Write-Host "FAIL spawnfail: expected exit 125, got $($r3.Code)"; $fail++ }
            if ($r3.Err -notmatch 'AAI-SPAWN-ERROR') { Write-Host "FAIL spawnfail: expected AAI-SPAWN-ERROR on stderr, got none"; $fail++ }
            if ($r3.Out -match 'AAI-WRAPPER-SMOKE-MARKER') { Write-Host "FAIL spawnfail: marker must NOT appear (process never started)"; $fail++ }
            if ($r3.Out -match 'SHOULD-NOT-RUN') { Write-Host "FAIL spawnfail: fixture RAN (SHOULD-NOT-RUN captured) - 125 did not come from a pre-spawn failure"; $fail++ }
          }

          if ($fail -gt 0) { Write-Error "real-wrapper smoke failed under pwsh 7 ($fail check(s))"; exit 1 }
          Write-Host "REAL-WRAPPER SMOKE OK (pwsh 7): success/timeout/spawnfail all correct"

      - name: "5.1-only fallback proof in a doctored child (CHANGE-0136 Spec-AC-03)"
        # Runners carry BOTH engines, so every prefer-pwsh-else-powershell
        # fallback (Resolve-SelfTestEngine, the doctor's own engine pick and
        # every selftest child spawn) always took the pwsh arm in CI — the
        # powershell.exe-only path, a common corporate configuration
        # (Windows PowerShell 5.1 plus Git Bash, no pwsh), was never
        # exercised. This step proves it for real, in a doctored CHILD
        # environment only (same technique class as the CHANGE-0135 D3
        # decoy): the child's own script text sets Path to the parent PATH
        # minus every directory containing pwsh.exe. Nothing on the host is
        # ever uninstalled, relocated or otherwise mutated. Controls hold in
        # BOTH directions: pwsh must resolve in the undoctored parent (else
        # the hiding check would be vacuous) and must resolve to NOTHING
        # inside the doctored child (distinct exit code 97 if the hiding
        # itself silently stopped working — intake AC-002's named failure).
        # This job has no WSL distro, so this also covers the corporate
        # powershell.exe-plus-Git-Bash-only shape end to end.
        shell: powershell   # Windows PowerShell 5.1 (the field environment)
        run: |
          $ErrorActionPreference = "Stop"
          # Control direction 1: pwsh IS resolvable in the undoctored parent.
          $pwshCmds = @(Get-Command pwsh.exe -ErrorAction SilentlyContinue -All)
          if ($pwshCmds.Count -eq 0) {
            Write-Error "CONTROL FAIL: pwsh is not resolvable in the undoctored parent -- the child-side hiding check below would be vacuous"; exit 1
          }
          Write-Host "CONTROL OK: pwsh resolvable in the undoctored parent: $($pwshCmds[0].Source)"
          # Reduced PATH: the current PATH minus every directory in which
          # pwsh.exe exists (surgical — node, git and the wrapper's Git Bash
          # resolution all survive the filter).
          $keep = @()
          foreach ($d in ($env:Path -split ';')) {
            if (-not $d) { continue }
            $probe = $null
            try { $probe = Join-Path $d 'pwsh.exe' } catch { $keep += $d; continue }
            if (Test-Path -LiteralPath $probe -PathType Leaf) { Write-Host "PATH filter drops: $d"; continue }
            $keep += $d
          }
          $reducedPath = ($keep -join ';')
          $repoRoot = (Get-Location).Path
          $doctorJson = Join-Path $env:RUNNER_TEMP 'aai-51only-doctor.json'
          $innerPath = Join-Path $env:RUNNER_TEMP 'aai-51only-inner.ps1'
          $inner = @'
          $ErrorActionPreference = 'Stop'
          $env:Path = '__REDUCED_PATH__'
          $env:PATH = '__REDUCED_PATH__'
          # Control direction 2: pwsh must resolve to NOTHING here — a
          # distinct loud exit code if the hiding silently stopped working.
          $still = Get-Command pwsh -ErrorAction SilentlyContinue
          if ($still) { Write-Host "CONTROL FAIL: pwsh still resolves in the doctored child: $($still.Source)"; exit 97 }
          Write-Host "CONTROL OK: pwsh is not resolvable in the doctored child"
          Set-Location '__REPO_ROOT__'
          . (Join-Path '__REPO_ROOT__' '.aai\scripts\aai-win-selftest.ps1')
          $engine = Resolve-SelfTestEngine
          if ($engine -ne 'powershell') { Write-Host "FAIL: Resolve-SelfTestEngine returned [$engine], expected powershell"; exit 98 }
          Write-Host "Resolve-SelfTestEngine -> powershell (5.1-only fallback taken for real)"
          $jsonText = (& node .aai\scripts\aai-doctor.mjs --json) -join [Environment]::NewLine
          Write-Host "doctor exit code inside the doctored child: $LASTEXITCODE"
          Set-Content -LiteralPath '__DOCTOR_JSON__' -Value $jsonText
          exit 0
          '@
          $inner = $inner.Replace('__REDUCED_PATH__', ($reducedPath -replace "'", "''"))
          $inner = $inner.Replace('__REPO_ROOT__', ($repoRoot -replace "'", "''"))
          $inner = $inner.Replace('__DOCTOR_JSON__', ($doctorJson -replace "'", "''"))
          Set-Content -LiteralPath $innerPath -Value $inner
          $outFile = Join-Path $env:RUNNER_TEMP 'aai-51only.out'
          $errFile = Join-Path $env:RUNNER_TEMP 'aai-51only.err'
          # OS-handle stream capture on a REAL child; pre-quoted argument
          # string (Start-Process silently space-joins array elements);
          # .Handle touched immediately (the 5.1 ExitCode-null footgun).
          $argString = '"-NoProfile" "-File" "' + $innerPath + '"'
          $p = Start-Process -FilePath powershell.exe -ArgumentList $argString -NoNewWindow -PassThru `
                -RedirectStandardOutput $outFile -RedirectStandardError $errFile
          $null = $p.Handle
          $p.WaitForExit()
          Get-Content $outFile -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "child| $_" }
          Get-Content $errFile -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "child-err| $_" }
          if ($p.ExitCode -eq 97) { Write-Error "CONTROL FAIL: pwsh was still resolvable inside the doctored child (exit 97) -- the hiding silently stopped working"; exit 1 }
          if ($p.ExitCode -eq 98) { Write-Error "FAIL: Resolve-SelfTestEngine did not return powershell in the doctored child (exit 98)"; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "doctored child failed with exit $($p.ExitCode)"; exit 1 }
          # The doctor ran INSIDE the doctored context; assert its CAT-14
          # arms here from the JSON it wrote (parsing location is irrelevant
          # to what the run proved).
          $doc = Get-Content -LiteralPath $doctorJson -Raw | ConvertFrom-Json
          $cat14 = $doc.categories | Where-Object { $_.id -eq 'CAT-14' } | Select-Object -First 1
          $fail = 0
          if (-not $cat14) { Write-Host "FAIL: no CAT-14 category in the doctored-context doctor output"; $fail++ }
          $arms = @()
          if ($cat14 -and $cat14.detail -and $cat14.detail.arms) { $arms = @($cat14.detail.arms) }
          if ($arms.Count -ne 3) { Write-Host "FAIL: expected 3 CAT-14 arms from the doctored-context run, got $($arms.Count)"; $fail++ }
          foreach ($a in $arms) {
            if ($a.status -ne 'PASS') { Write-Host "FAIL: CAT-14 arm $($a.name) is $($a.status) (exit $($a.exitCode)) under powershell.exe"; $fail++ }
            else { Write-Host "CAT-14 arm $($a.name): PASS (exit $($a.exitCode)) under powershell.exe"; }
          }
          if ($fail -gt 0) { Write-Error "5.1-only doctored-child proof failed ($fail check(s))"; exit 1 }
          Write-Host "5.1-ONLY FALLBACK OK: pwsh hidden in the child, Resolve-SelfTestEngine -> powershell, all three CAT-14 arms PASS under powershell.exe"

      - name: "Cache PowerShell modules (Windows PowerShell 5.1 + pwsh 7 CurrentUser scopes)"
        # CHANGE-0134 Spec-AC-01: the two engines have SEPARATE CurrentUser
        # module scopes on Windows (Documents\WindowsPowerShell\Modules vs
        # Documents\PowerShell\Modules) — both are cached under one key so a
        # warm run installs neither.
        uses: actions/cache@v4
        with:
          path: |
            ~\Documents\WindowsPowerShell\Modules
            ~\Documents\PowerShell\Modules
          # -v1 is a manual cache-busting discriminator (INFO-5): unlike the
          # `gate` job's key above, nothing here rotates automatically, so a
          # bad/partial first save would be restored forever without a
          # bumpable segment to invalidate it.
          key: ps-modules-${{ runner.os }}-pester5-win-v1

      - name: "Install Pester 5 for Windows PowerShell 5.1 (CHANGE-0134 Spec-AC-01)"
        # Windows PowerShell 5.1 ships Pester 3.4.0 as a built-in system
        # module, so "is Pester present" is never a good enough check — it is
        # ALWAYS present, at the wrong major version, and a bare Import-Module
        # would silently bind to it and run a subset of the file while
        # reporting success (the exact "Pester availability decision" trap
        # recorded in this scope's spec). Only install when no major>=5
        # module is already available; the TLS 1.2 + NuGet provider bootstrap
        # is required non-interactively on 5.1 or Install-Module fails/prompts.
        shell: powershell   # Windows PowerShell 5.1 (the field environment)
        run: |
          $ErrorActionPreference = "Stop"
          $existing = Get-Module Pester -ListAvailable | Where-Object { $_.Version.Major -ge 5 } | Select-Object -First 1
          if (-not $existing) {
            [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
            if (-not (Get-PackageProvider -Name NuGet -ErrorAction SilentlyContinue)) {
              Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
            }
            Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -MinimumVersion 5.0
          }
          Import-Module Pester -MinimumVersion 5.0
          $ver = (Get-Module Pester | Sort-Object Version -Descending | Select-Object -First 1).Version
          if ($ver.Major -lt 5) { Write-Error "Pester major version $ver < 5 under Windows PowerShell 5.1 (5.1's built-in 3.4.0 silent-bind trap)"; exit 1 }
          Write-Host "Pester $ver ready under Windows PowerShell 5.1"

      - name: "Install Pester 5 for pwsh 7 (CHANGE-0134 Spec-AC-01)"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $existing = Get-Module Pester -ListAvailable | Where-Object { $_.Version.Major -ge 5 } | Select-Object -First 1
          if (-not $existing) {
            Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -MinimumVersion 5.0
          }
          Import-Module Pester -MinimumVersion 5.0
          $ver = (Get-Module Pester | Sort-Object Version -Descending | Select-Object -First 1).Version
          if ($ver.Major -lt 5) { Write-Error "Pester major version $ver < 5 under pwsh 7"; exit 1 }
          Write-Host "Pester $ver ready under pwsh 7"

      - name: "Full Pester suite discovery under Windows PowerShell 5.1 (CHANGE-0134 Spec-AC-01/Spec-AC-02)"
        # Runs the SAME tests/skills Pester discovery the `gate` job runs on
        # Linux (directory-based, so a new *.Tests.ps1 file is picked up
        # without a workflow edit — SEAM-4), under the actual engine that
        # broke CHANGE-0133 four times blind. AAI-PESTER-VERSION and
        # AAI-PESTER-ELAPSED are printed unconditionally; the step fails on
        # any Pester failure, a Pester major version below 5, a measured
        # duration over the 600s hard ceiling, or an AAI-WIN-SKIP line count
        # that disagrees with either Pester's own SkippedCount or the
        # job-level declared expected count (SEAM-1, both directions).
        shell: powershell   # Windows PowerShell 5.1 (the field environment)
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module Pester -MinimumVersion 5.0
          $ver = (Get-Module Pester | Sort-Object Version -Descending | Select-Object -First 1).Version
          if ($ver.Major -lt 5) { Write-Error "Pester major version $ver < 5 under Windows PowerShell 5.1"; exit 1 }
          Write-Host "AAI-PESTER-VERSION: powershell $ver"
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'tests/skills'
          $cfg.Run.PassThru = $true
          $cfg.Output.Verbosity = 'Detailed'
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $result = Invoke-Pester -Configuration $cfg
          $sw.Stop()
          $elapsed = [Math]::Round($sw.Elapsed.TotalSeconds, 2)
          Write-Host "AAI-PESTER-ELAPSED: powershell ${elapsed}s"
          $skipLines = 0
          foreach ($s in $result.Skipped) {
            Write-Host "AAI-WIN-SKIP: $($s.ExpandedPath)"
            $skipLines++
          }
          $expected = [int]$env:AAI_EXPECTED_WIN_SKIP_COUNT
          $fail = 0
          if ($result.FailedCount -gt 0) { Write-Host "FAIL: FailedCount=$($result.FailedCount)"; $fail++ }
          if ($result.FailedContainersCount -gt 0) { Write-Host "FAIL: FailedContainersCount=$($result.FailedContainersCount) (a .Tests.ps1 failed Pester DISCOVERY -- a parse/syntax error under this engine)"; $fail++ }
          if ($result.TotalCount -lt 111) { Write-Host "FAIL: TotalCount=$($result.TotalCount) is below the declared floor of 111 (symmetric with the POSIX gate's TEST-005 floor; catches a vacuous discovery)"; $fail++ }
          if ($elapsed -gt 600) { Write-Host "FAIL: elapsed ${elapsed}s exceeds the 600s ceiling"; $fail++ }
          if ($skipLines -ne $result.SkippedCount) { Write-Host "FAIL: AAI-WIN-SKIP line count ($skipLines) != Pester SkippedCount ($($result.SkippedCount))"; $fail++ }
          if ($result.SkippedCount -ne $expected) { Write-Host "FAIL: SkippedCount ($($result.SkippedCount)) != declared expected ($expected)"; $fail++ }
          if ($fail -gt 0) { Write-Error "Pester gate failed under Windows PowerShell 5.1 ($fail check(s))"; exit 1 }
          Write-Host "PESTER OK (Windows PowerShell 5.1): $($result.PassedCount) passed, $($result.SkippedCount) skipped, 0 failed, ${elapsed}s"

      - name: "Full Pester suite discovery under pwsh 7 (CHANGE-0134 Spec-AC-01/Spec-AC-02)"
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module Pester -MinimumVersion 5.0
          $ver = (Get-Module Pester | Sort-Object Version -Descending | Select-Object -First 1).Version
          if ($ver.Major -lt 5) { Write-Error "Pester major version $ver < 5 under pwsh 7"; exit 1 }
          Write-Host "AAI-PESTER-VERSION: pwsh $ver"
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'tests/skills'
          $cfg.Run.PassThru = $true
          $cfg.Output.Verbosity = 'Detailed'
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $result = Invoke-Pester -Configuration $cfg
          $sw.Stop()
          $elapsed = [Math]::Round($sw.Elapsed.TotalSeconds, 2)
          Write-Host "AAI-PESTER-ELAPSED: pwsh ${elapsed}s"
          $skipLines = 0
          foreach ($s in $result.Skipped) {
            Write-Host "AAI-WIN-SKIP: $($s.ExpandedPath)"
            $skipLines++
          }
          $expected = [int]$env:AAI_EXPECTED_WIN_SKIP_COUNT
          $fail = 0
          if ($result.FailedCount -gt 0) { Write-Host "FAIL: FailedCount=$($result.FailedCount)"; $fail++ }
          if ($result.FailedContainersCount -gt 0) { Write-Host "FAIL: FailedContainersCount=$($result.FailedContainersCount) (a .Tests.ps1 failed Pester DISCOVERY -- a parse/syntax error under this engine)"; $fail++ }
          if ($result.TotalCount -lt 111) { Write-Host "FAIL: TotalCount=$($result.TotalCount) is below the declared floor of 111 (symmetric with the POSIX gate's TEST-005 floor; catches a vacuous discovery)"; $fail++ }
          if ($elapsed -gt 600) { Write-Host "FAIL: elapsed ${elapsed}s exceeds the 600s ceiling"; $fail++ }
          if ($skipLines -ne $result.SkippedCount) { Write-Host "FAIL: AAI-WIN-SKIP line count ($skipLines) != Pester SkippedCount ($($result.SkippedCount))"; $fail++ }
          if ($result.SkippedCount -ne $expected) { Write-Host "FAIL: SkippedCount ($($result.SkippedCount)) != declared expected ($expected)"; $fail++ }
          if ($fail -gt 0) { Write-Error "Pester gate failed under pwsh 7 ($fail check(s))"; exit 1 }
          Write-Host "PESTER OK (pwsh 7): $($result.PassedCount) passed, $($result.SkippedCount) skipped, 0 failed, ${elapsed}s"

  windows-wsl1:
    # CHANGE-0136 Spec-AC-01/Spec-AC-02: the functional-WSL leg. windows-latest
    # ships wsl.exe with ZERO distros, so the wrapper's WSL branch had never
    # run end-to-end in CI (both Codex P1 findings on PR #249 lived exactly
    # there). A SEPARATE job, never steps in windows-5_1 (D2): a distro
    # install is HOST-GLOBAL and would flip Test-WslUsable to true for every
    # step of the existing job, destroying the proven zero-distro fallback
    # coverage (the TEST-010 field defect's live regression bed).
    # WSL1 ONLY (D1, honesty): hosted runners have no nested virtualization,
    # so WSL2 cannot run here at all — WSL2-specific failure classes (e.g.
    # E_ACCESSDENIED) remain field-only, per SPEC-0046 MV-1..MV-3.
    name: functional WSL1 leg (wrapper WSL routing + selftest arms + full 5.1 Pester)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Install WSL1 Debian (CHANGE-0136 Spec-AC-01 / D1)"
        # Pinned by MAJOR tag (v7 verified current via
        # `gh api repos/Vampire/setup-wsl/releases/latest` at build time);
        # test_019 pins the @v-major SHAPE so a future bump is a reviewed
        # one-token change. Debian over Alpine: the delegated aai-run-tests.sh
        # depends on setsid/procps/mktemp shapes busybox does not provide.
        uses: Vampire/setup-wsl@v7
        with:
          distribution: Debian-12   # setup-wsl@v7 catalog uses versioned names (bare 'Debian' rejected — PR #251 run 31679696225)
          wsl-version: 1

      - name: "Controls: WSL is genuinely functional and genuinely WSL1 (CHANGE-0136 Spec-AC-01 / D1)"
        # Three controls, each a NAMED loud failure — a half-broken setup-wsl
        # install must never silently degrade this leg into a duplicate
        # Git Bash run (SEAM-1):
        #   1. functional sentinel: & wsl.exe -e sh -c "exit 42" must return
        #      exactly 42 — the SAME semantics as Test-WslUsable's own probe
        #      (direct call operator = native argv; the Start-Process
        #      pre-quoting footgun does not apply to &).
        #   2. wsl -l -v must report the distro at VERSION 1 — the leg can
        #      never silently become a WSL2 claim.
        #   3. wslpath -a must translate a C:\ path into /mnt/c — the exact
        #      seam the selftest success arm's marker translation crosses.
        shell: powershell   # Windows PowerShell 5.1 (the field environment)
        run: |
          $ErrorActionPreference = "Stop"
          $env:WSL_UTF8 = "1"
          $fail = 0
          & wsl.exe -e sh -c "exit 42"
          if ($LASTEXITCODE -ne 42) { Write-Host "CONTROL FAIL: sentinel wsl.exe -e sh -c 'exit 42' exited $LASTEXITCODE (expected exactly 42) -- setup-wsl left WSL non-functional"; $fail++ }
          else { Write-Host "CONTROL OK: functional sentinel exited 42" }
          # UTF-16LE output guard: WSL_UTF8=1 asks for UTF-8, and the null
          # strip below covers runners whose wsl.exe predates that variable.
          $lv = (& wsl.exe -l -v | Out-String) -replace "`0", ''
          Write-Host "wsl -l -v reports:`n$lv"
          if ($lv -notmatch '(?m)Debian.*\s1\s*$') { Write-Host "CONTROL FAIL: wsl.exe -l -v does not report Debian at VERSION 1 -- this leg must never silently become a WSL2 (or broken-install) claim"; $fail++ }
          else { Write-Host "CONTROL OK: Debian reported at VERSION 1" }
          # C:\Windows, not a bare 'C:\': a trailing backslash before the
          # closing quote is mangled by native argv quoting on 5.1.
          $mnt = (& wsl.exe -e wslpath -a 'C:\Windows' | Out-String).Trim()
          Write-Host "wslpath -a C:\Windows -> [$mnt]"
          if ($mnt -notmatch '^/mnt/c') { Write-Host "CONTROL FAIL: wslpath -a 'C:\Windows' returned [$mnt], expected a path beginning /mnt/c"; $fail++ }
          else { Write-Host "CONTROL OK: wslpath translates into /mnt/c" }
          if ($fail -gt 0) { Write-Error "WSL1 controls failed ($fail check(s)) -- failing loudly instead of degrading into a duplicate Git Bash leg"; exit 1 }
          Write-Host "WSL1 CONTROLS OK: sentinel 42 + VERSION 1 + wslpath /mnt/c"

      - name: "Wrapper routes via the WSL branch, live (CHANGE-0136 Spec-AC-01)"
        # One REAL aai-run-tests.ps1 invocation. Captured at the OS-handle
        # level (Start-Process -RedirectStandardError on a real child):
        # the AAI-BRANCH diagnostic is written via [Console]::Error, which an
        # in-process 2> never sees.
        shell: powershell   # Windows PowerShell 5.1 (the field environment)
        run: |
          $ErrorActionPreference = "Stop"
          $scriptPath = (Resolve-Path ".\.aai\scripts\aai-run-tests.ps1").Path
          $outFile = Join-Path $env:RUNNER_TEMP "aai-wsl1-route.out"
          $errFile = Join-Path $env:RUNNER_TEMP "aai-wsl1-route.err"
          $cmd = "& '" + ($scriptPath -replace "'", "''") + "' sh -c 'exit 0'; exit `$LASTEXITCODE"
          $p = Start-Process -FilePath powershell.exe -ArgumentList @('-NoProfile', '-Command', $cmd) -NoNewWindow -PassThru -Wait `
                -RedirectStandardOutput $outFile -RedirectStandardError $errFile
          $out = Get-Content $outFile -Raw -ErrorAction SilentlyContinue
          $err = Get-Content $errFile -Raw -ErrorAction SilentlyContinue
          Write-Host "routing run: code=$($p.ExitCode) out=[$out] err=[$err]"
          $fail = 0
          if ($p.ExitCode -ne 0) { Write-Host "FAIL: expected exit 0 from the wrapper, got $($p.ExitCode)"; $fail++ }
          if ($err -notmatch 'AAI-BRANCH:\s*WSL') { Write-Host "FAIL: expected an AAI-BRANCH: WSL line on the wrapper's stderr (WSL routing not taken)"; $fail++ }
          if ($fail -gt 0) { Write-Error "WSL routing proof failed ($fail check(s))"; exit 1 }
          Write-Host "WSL ROUTING OK: wrapper exit 0 with AAI-BRANCH: WSL on stderr"

      - name: "Vendored selftest with WSL semantics via the doctor (CHANGE-0136 Spec-AC-01)"
        # Deliberate reuse (SPEC-0122 D1): the three-arm smoke on this leg IS
        # the vendored selftest through aai-doctor.mjs — never a third smoke
        # implementation. This is the first real execution of both e398686
        # fixes: the success arm's marker is written through the payload's
        # own `command -v wslpath` translation, and the spawnfail arm only
        # reaches the decoy because the selftest's reduced PATH hides wsl.exe
        # (a regression there routes the arm through WSL and fails the
        # marker-must-not-exist check — the desired loud signal). The raw
        # smoke fixtures above are NOT reused here: $AAI_SMOKE_MARKER_FILE is
        # a Windows env var + Windows path, which WSL drops/cannot read
        # (no WSLENV), so their assertions would be vacuous on this leg.
        # node is a real child process, so plain output capture is already
        # a real-stream read; the AAI-BRANCH evidence sits INSIDE the JSON
        # (the selftest captures each arm at the OS-handle level itself).
        shell: powershell   # Windows PowerShell 5.1 (the field environment)
        run: |
          $ErrorActionPreference = "Stop"
          $jsonText = (& node .aai/scripts/aai-doctor.mjs --json) -join "`n"
          Write-Host "doctor exit code: $LASTEXITCODE (load-bearing: no later native call resets it, so GitHub's appended 'exit `$LASTEXITCODE' re-raises a doctor FAIL — deliberate fail-closed on top of the content assertions below)"
          $doc = $jsonText | ConvertFrom-Json
          $fail = 0
          $cat15 = $doc.categories | Where-Object { $_.id -eq 'CAT-15' } | Select-Object -First 1
          if (-not $cat15) { Write-Host "FAIL: no CAT-15 category in doctor output"; $fail++ }
          elseif ($cat15.detail.wsl -ne 'functional') { Write-Host "FAIL: CAT-15 wsl tri-state is [$($cat15.detail.wsl)], expected functional"; $fail++ }
          else { Write-Host "CAT-15 OK: wsl functional" }
          $cat14 = $doc.categories | Where-Object { $_.id -eq 'CAT-14' } | Select-Object -First 1
          $arms = @()
          if ($cat14 -and $cat14.detail -and $cat14.detail.arms) { $arms = @($cat14.detail.arms) }
          if ($arms.Count -ne 3) { Write-Host "FAIL: expected 3 CAT-14 arms, got $($arms.Count)"; $fail++ }
          $success = $arms | Where-Object { $_.name -eq 'success' } | Select-Object -First 1
          $timeout = $arms | Where-Object { $_.name -eq 'timeout' } | Select-Object -First 1
          $spawnfail = $arms | Where-Object { $_.name -eq 'spawnfail' } | Select-Object -First 1
          if (-not $success) { Write-Host "FAIL: no 'success' arm"; $fail++ }
          else {
            if ($success.status -ne 'PASS') { Write-Host "FAIL: success arm status $($success.status)"; $fail++ }
            if ($success.exitCode -ne 3) { Write-Host "FAIL: success arm exit $($success.exitCode), expected 3"; $fail++ }
            if (-not $success.markerOk) { Write-Host "FAIL: success arm marker not written through the payload wslpath translation"; $fail++ }
            if ($success.diag -notmatch 'AAI-BRANCH:\s*WSL') { Write-Host "FAIL: success arm diag [$($success.diag)] does not show WSL routing"; $fail++ }
            else { Write-Host "success arm OK: exit 3, marker translated+written, diag [$($success.diag)]" }
          }
          if (-not $timeout) { Write-Host "FAIL: no 'timeout' arm"; $fail++ }
          else {
            if ($timeout.status -ne 'PASS') { Write-Host "FAIL: timeout arm status $($timeout.status)"; $fail++ }
            if ($timeout.exitCode -ne 124) { Write-Host "FAIL: timeout arm exit $($timeout.exitCode), expected 124"; $fail++ }
            else { Write-Host "timeout arm OK: exit 124, diag [$($timeout.diag)]" }
          }
          if (-not $spawnfail) { Write-Host "FAIL: no 'spawnfail' arm"; $fail++ }
          else {
            if ($spawnfail.status -ne 'PASS') { Write-Host "FAIL: spawnfail arm status $($spawnfail.status)"; $fail++ }
            if ($spawnfail.exitCode -ne 125) { Write-Host "FAIL: spawnfail arm exit $($spawnfail.exitCode), expected 125"; $fail++ }
            if ($spawnfail.spawnErrorCount -ne 1) { Write-Host "FAIL: spawnfail arm AAI-SPAWN-ERROR count $($spawnfail.spawnErrorCount), expected exactly 1"; $fail++ }
            else { Write-Host "spawnfail arm OK: exit 125, exactly one AAI-SPAWN-ERROR (decoy reached with wsl.exe hidden)" }
          }
          if ($fail -gt 0) { Write-Error "selftest-with-WSL-semantics proof failed ($fail check(s))"; exit 1 }
          Write-Host "SELFTEST OK (WSL semantics): success 3 via wslpath-translated marker, timeout 124, spawnfail 125"

      - name: "Cache PowerShell modules (Windows PowerShell 5.1 scope, WSL1 leg)"
        # Same shape as the windows-5_1 job's cache, distinct key
        # discriminator (this leg installs for the 5.1 scope only — D2: the
        # two-engine matrix is already proven on the no-WSL leg).
        uses: actions/cache@v4
        with:
          path: ~\Documents\WindowsPowerShell\Modules
          key: ps-modules-${{ runner.os }}-pester5-win-wsl1-v1

      - name: "Install Pester 5 for Windows PowerShell 5.1 (WSL1 leg)"
        # Byte-for-byte the same install-if-missing logic as the windows-5_1
        # job's 5.1 step — see its header for the built-in 3.4.0 silent-bind
        # trap and the TLS 1.2 + NuGet bootstrap rationale.
        shell: powershell   # Windows PowerShell 5.1 (the field environment)
        run: |
          $ErrorActionPreference = "Stop"
          $existing = Get-Module Pester -ListAvailable | Where-Object { $_.Version.Major -ge 5 } | Select-Object -First 1
          if (-not $existing) {
            [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
            if (-not (Get-PackageProvider -Name NuGet -ErrorAction SilentlyContinue)) {
              Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
            }
            Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -MinimumVersion 5.0
          }
          Import-Module Pester -MinimumVersion 5.0
          $ver = (Get-Module Pester | Sort-Object Version -Descending | Select-Object -First 1).Version
          if ($ver.Major -lt 5) { Write-Error "Pester major version $ver < 5 under Windows PowerShell 5.1 (5.1's built-in 3.4.0 silent-bind trap)"; exit 1 }
          Write-Host "Pester $ver ready under Windows PowerShell 5.1"

      - name: "Full Pester suite discovery under Windows PowerShell 5.1 with WSL usable (CHANGE-0136 Spec-AC-02)"
        # The SAME tests/skills discovery and the IDENTICAL result-floor
        # discipline as the windows-5_1 job's 5.1 step — floor 111, 600s
        # ceiling, AAI-WIN-SKIP reconciled in both directions against the
        # single workflow-level expected count (4: every PosixOnly skip
        # predicate is host-OS-driven, none is WSL-state-driven, so the
        # count holds on a WSL-usable host too). Inside this run the
        # CHANGE-0135 host-adaptive end-to-end test executes with real WSL
        # routing for the first time.
        shell: powershell   # Windows PowerShell 5.1 (the field environment)
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module Pester -MinimumVersion 5.0
          $ver = (Get-Module Pester | Sort-Object Version -Descending | Select-Object -First 1).Version
          if ($ver.Major -lt 5) { Write-Error "Pester major version $ver < 5 under Windows PowerShell 5.1"; exit 1 }
          Write-Host "AAI-PESTER-VERSION: powershell (WSL1 leg) $ver"
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'tests/skills'
          $cfg.Run.PassThru = $true
          $cfg.Output.Verbosity = 'Detailed'
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $result = Invoke-Pester -Configuration $cfg
          $sw.Stop()
          $elapsed = [Math]::Round($sw.Elapsed.TotalSeconds, 2)
          Write-Host "AAI-PESTER-ELAPSED: powershell (WSL1 leg) ${elapsed}s"
          $skipLines = 0
          foreach ($s in $result.Skipped) {
            Write-Host "AAI-WIN-SKIP: $($s.ExpandedPath)"
            $skipLines++
          }
          $expected = [int]$env:AAI_EXPECTED_WIN_SKIP_COUNT
          $fail = 0
          if ($result.FailedCount -gt 0) { Write-Host "FAIL: FailedCount=$($result.FailedCount)"; $fail++ }
          if ($result.FailedContainersCount -gt 0) { Write-Host "FAIL: FailedContainersCount=$($result.FailedContainersCount) (a .Tests.ps1 failed Pester DISCOVERY -- a parse/syntax error under this engine)"; $fail++ }
          if ($result.TotalCount -lt 111) { Write-Host "FAIL: TotalCount=$($result.TotalCount) is below the declared floor of 111 (symmetric with the POSIX gate's TEST-005 floor; catches a vacuous discovery)"; $fail++ }
          if ($elapsed -gt 600) { Write-Host "FAIL: elapsed ${elapsed}s exceeds the 600s ceiling"; $fail++ }
          if ($skipLines -ne $result.SkippedCount) { Write-Host "FAIL: AAI-WIN-SKIP line count ($skipLines) != Pester SkippedCount ($($result.SkippedCount))"; $fail++ }
          if ($result.SkippedCount -ne $expected) { Write-Host "FAIL: SkippedCount ($($result.SkippedCount)) != declared expected ($expected)"; $fail++ }
          if ($fail -gt 0) { Write-Error "Pester gate failed under Windows PowerShell 5.1 with WSL usable ($fail check(s))"; exit 1 }
          Write-Host "PESTER OK (Windows PowerShell 5.1, WSL1 leg): $($result.PassedCount) passed, $($result.SkippedCount) skipped, 0 failed, ${elapsed}s"
