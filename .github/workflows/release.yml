name: release

# Publish a GitHub Release when a version tag is pushed or when a release PR merges to main.
#
# On merge to main: if the commit is `chore(release): <version>`, CI creates the
# annotated tag on the merge commit, pushes it, and publishes the release with notes
# from the rolled CHANGELOG section.
# On tag push: if a version tag is pushed directly, it publishes the release idempotently.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: tag and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag and publish release (idempotent; notes from the CHANGELOG section)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            COMMIT_MSG="$(git log -1 --format=%s)"
            if [[ "$COMMIT_MSG" =~ ^chore\(release\):[[:space:]]*(v?[0-9][^[:space:]]*) ]]; then
              TAG="${BASH_REMATCH[1]}"
            else
              echo "Commit on main is not a release commit ($COMMIT_MSG) — nothing to do."
              exit 0
            fi

            # Create and push annotated tag on the merge commit if it doesn't already exist
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
              echo "Tag $TAG already exists — skipping tag creation."
            else
              echo "Creating and pushing annotated tag $TAG on merge commit $(git rev-parse HEAD)..."
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG" -m "$TAG"
              git push origin "refs/tags/$TAG"
            fi
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          fi

          if [ ! -f CHANGELOG.md ]; then
            echo "CHANGELOG.md is missing from the tagged commit — refusing to publish." >&2
            exit 1
          fi

          notes="$(mktemp)"
          trap 'rm -f "$notes"' EXIT
          awk -v tag="$TAG" '
            index($0, "## [" tag "]") == 1 { grab = 1; print; next }
            grab && index($0, "## [") == 1 && index($0, "## [" tag "]") != 1 { exit }
            grab { print }
          ' CHANGELOG.md > "$notes"

          publish() {
            if [ -s "$notes" ]; then
              gh release create "$TAG" --title "$TAG" --notes-file "$notes"
              echo "Published $TAG with notes from the CHANGELOG [$TAG] section."
            else
              echo "No '## [$TAG]' section in CHANGELOG.md — using auto-generated notes."
              gh release create "$TAG" --title "$TAG" --generate-notes
            fi
          }

          set +e
          pub_out="$(publish 2>&1)"
          pub_rc=$?
          set -e
          if [ "$pub_rc" -eq 0 ]; then
            printf '%s\n' "$pub_out"
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists (created concurrently) — nothing to do."
          else
            printf '%s\n' "$pub_out" >&2
            exit "$pub_rc"
          fi
