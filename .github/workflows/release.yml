name: release

# Publish a GitHub Release when a version tag is pushed.
#
# This is the automation path that lets a release be published WITHOUT any
# agent (or CI job other than this one) holding gh write permissions: an
# operator — or `.aai/scripts/aai-release.sh` — creates the annotated `vX` tag
# and pushes it, and this workflow turns that pushed tag into a published
# Release using the built-in GITHUB_TOKEN.
#
# Notes come from the matching `## [<tag>]` CHANGELOG.md section(s), the same
# source `aai-release.sh` uses for its own `--notes-file`. The step is
# IDEMPOTENT: a pre-check of `gh release view` skips work when the release
# already exists, and a failed `gh release create` is still treated as success
# when the release is then visible (the race with a concurrent
# `aai-release.sh --confirm` publish). The two paths never double-publish or
# fail each other.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: publish GitHub release from the pushed tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish release (idempotent; notes from the CHANGELOG section)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Cheap skip when already published (e.g. by aai-release.sh --confirm
          # on a host with gh write). The create call below is the real
          # idempotency gate: a concurrent publisher can pass this check and
          # still win the create.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          fi

          if [ ! -f CHANGELOG.md ]; then
            echo "CHANGELOG.md is missing from the tagged commit — refusing to publish." >&2
            exit 1
          fi

          # Extract every consecutive '## [<tag>] — ...' section from the
          # CHANGELOG (a cut rolls one titled block per entry under the same
          # version), stopping at the next DIFFERENT version header. Literal
          # prefix match (index ==1) so a version's dots are never treated as
          # regex. Mirrors the section aai-release.sh writes to its notes file.
          # No `|| true`: an awk/IO failure must fail the job, not publish
          # truncated or auto-generated notes under a false "no section" claim.
          notes="$(mktemp)"
          trap 'rm -f "$notes"' EXIT
          awk -v tag="$TAG" '
            index($0, "## [" tag "]") == 1 { grab = 1; print; next }
            grab && index($0, "## [") == 1 && index($0, "## [" tag "]") != 1 { exit }
            grab { print }
          ' CHANGELOG.md > "$notes"

          publish() {
            if [ -s "$notes" ]; then
              gh release create "$TAG" --title "$TAG" --notes-file "$notes"
              echo "Published $TAG with notes from the CHANGELOG [$TAG] section."
            else
              echo "No '## [$TAG]' section in CHANGELOG.md — using auto-generated notes."
              gh release create "$TAG" --title "$TAG" --generate-notes
            fi
          }

          set +e
          pub_out="$(publish 2>&1)"
          pub_rc=$?
          set -e
          if [ "$pub_rc" -eq 0 ]; then
            printf '%s\n' "$pub_out"
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists (created concurrently) — nothing to do."
          else
            printf '%s\n' "$pub_out" >&2
            exit "$pub_rc"
          fi
