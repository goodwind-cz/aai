name: skill-suite

# Gates the tests/skills/ suite in CI (test-infra-reds-and-ci-gate /
# spec-test-infra-reds-and-ci-gate AC-004). Before that change, CI only ran
# docs-numbering + ps1-quality, so skill-suite regressions accumulated
# invisibly. This workflow runs the same suite on every push/PR.
#
# CI TEST-IMPACT SELECTION (CHANGE ci-test-impact-selection /
# spec-ci-test-impact-selection). A typical PR push touches 2-5 mappable
# surfaces; running all ~50 suites on every review-fix push burned 12+
# CI-hours in one weekend. The `select` job runs
# .aai/scripts/select-suites.mjs against the diff and maps changed paths onto
# tests/skills/suite-map.yaml suites. Two outcomes:
#   - mode=selected: one `skills-selected` runner or two selected matrix legs
#     execute the independently checked conditional plan. Each runs ONLY the matched suites + the
#     always-on core set (check-state, docs-content, spec-lint, hygiene-pack), via
#     ONE `test-framework.sh` invocation with a repeated `--skill <name>` flag
#     per suite (never a hand-rolled runner — reuses the exit-42-is-SKIP
#     contract and the bounded-width wave path test-framework.sh already
#     owns). A per-suite `for` loop of `--skill` would clone isolation
#     serially and ignore PARALLEL_WIDTH. Both skills jobs pin
#     AAI_TEST_PARALLEL=4 so a 4-core runner is not stuck at cpus-2 = 2.
#   - mode=full: `skills-full` runs the complete framework via
#     `test-framework.sh`, unchanged from before this feature. This is the
#     FAIL-OPEN path: an unmapped changed path, a `.aai/scripts/lib/**`
#     shared-lib change, or a `docs/ai/docs-audit.yaml` protected_paths_l3
#     change all force it, and the selector's own internal errors (bad
#     base-ref, unreadable map) fall open to it too — selection never
#     silently narrows coverage on a path it isn't sure about.
# `mode=full` is ALSO the unconditional outcome on push-to-main, the nightly
# schedule, workflow_dispatch, and any PR carrying the `ci-full` label — the
# selector itself is only consulted on `pull_request` events, and only when
# none of those overrides apply.
#
# HONEST TRADEOFF: the safety net moves, it does not disappear. A regression
# whose only signal lives in a suite the selector didn't pick for THIS diff
# is caught at merge-to-main (mode=full, always) or at the next nightly run —
# never silently dropped, but not on the PR itself either. suite-map.yaml is
# deliberately generous (over-selection is cheap; under-selection is exactly
# what the fail-open triad above exists to catch), and
# tests/skills/test-aai-hygiene-pack.sh pins that every test-aai-*.sh file
# has a suite-map row, so a new suite can't silently go unmapped.
#
# `ci-full` LABEL CAVEAT: GitHub Actions evaluates a PR's label set at the
# moment the workflow run STARTS. Adding the label after a PR is already open
# does not retroactively re-run this workflow — push an empty commit,
# `workflow_dispatch` it, or resync the PR (e.g. a rebase) after labeling.
# `pull_request` includes `edited` so body-dependent checks refresh when PR
# text changes. `labeled` is intentionally excluded: adding/removing an
# unrelated label never re-triggers the whole suite.
#
# `self-hosting-smoke` stays SEPARATE from the skill suite jobs with its own
# `timeout-minutes`; it is not a tests/skills/ suite. Ordinary push/PR/dispatch
# and nightly runs execute it. A proven `body-reuse` PR edit skips it and
# directly cites the matching successful source run instead. Ordinary suite
# selection does not otherwise narrow smoke coverage.
#
# fetch-depth: 0 is required on every job that runs tests/skills/ or the
# selector: tests/skills/test-aai-layer-profiles.sh probes full git history,
# and the selector's `--base-ref` diff needs the merge-base with main.
#
# SHARDING (CHANGE ci-test-selection-narrowing-and-sharding / SPEC-DRAFT-
# spec-ci-test-selection-narrowing-and-sharding). Narrowing (lib-graph impact
# analysis) was measured and deferred — see the spec's `## Scope decision`;
# sharding lands on every full run (17 of 40 PR runs, every push-to-main,
# every nightly) and changes no coverage, only wall-clock. The `select` job's
# `shard` step runs UNCONDITIONALLY (no `if:`), before the mode decision, so
# every event gets a shard plan whether or not it ends up in `mode=full`:
# `select-suites.mjs --shards 4` enumerates every `test-aai-*.sh` suite and
# assigns it to one of 4 shards by LPT (longest processing time first, by
# tests/skills/suite-weights.tsv), then `shard-plan-check.sh --check` proves
# — independently, no shared code with the selector — that the plan's suite
# set equals the on-disk set exactly (none missing, none extra, none twice).
# A failure here fails `select`, which fails `gate`.
# `skills-full` is now a matrix (fail-fast disabled) over `shard_ids`. Each leg
# receives the plan text through `env:` (never inline-interpolated into the
# script — a shard plan is untrusted-length data, not a shell token), writes
# it back to a file, and RE-RUNS `--check` against its OWN checkout: a
# pull_request merge ref can move between the `select` job and a leg's
# checkout, and a suite added on the base in between would otherwise be
# silently missing from that leg's plan. Only then does it `--extract` its
# own shard's suites and run ONE `test-framework.sh --skill ...` invocation
# (or the bare framework for the `"all"` fallback shard id). `gate` is
# unchanged: GitHub reports a matrix job's aggregate `result` as `success`
# only when every leg succeeded, so the existing full-mode success line
# already requires every shard to pass — no new line was needed there.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  schedule:
    - cron: '17 3 * * *'  # nightly full framework, ~03:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

# Every job below has read-only permissions and performs verification only.
# Non-PR events get a unique run identity and never cancel one another.
concurrency:
  group: ${{ format('{0}-{1}-{2}', github.workflow, github.event_name, github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-notes:
    name: release notes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require added notes or an explicit exemption
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Event body is data, never shell-interpolated or executed.
          node --input-type=module -e 'import fs from "node:fs"; const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8")); fs.writeFileSync("/tmp/aai-pr-body.txt", event.pull_request.body ?? "");'
          node .aai/scripts/release-notes-gate.mjs --base "$PR_BASE" --head "$PR_HEAD" --body-file /tmp/aai-pr-body.txt

  select:
    name: select suites (PR impact analysis; full elsewhere)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Carry-forward (post-validation-pushes-reuse-test-results, Spec-AC-07):
    # ci-select.mjs reads the PR's earlier workflow runs and jobs through the
    # API with the job's own GITHUB_TOKEN; the read scope on actions is the only addition.
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      suites: ${{ steps.select.outputs.suites }}
      shard_ids: ${{ steps.shard.outputs.shard_ids }}
      shard_plan: ${{ steps.shard.outputs.shard_plan }}
      checkout_sha: ${{ steps.identity.outputs.sha }}
      source_identity: ${{ steps.identity.outputs.source_identity }}
      body_proof: ${{ steps.select.outputs.body_proof }}
      selected_plan: ${{ steps.selected-plan.outputs.selected_plan }}
      selected_shard_ids: ${{ steps.selected-plan.outputs.shard_ids }}
      selected_runners: ${{ steps.selected-plan.outputs.runners }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - id: identity
        name: Pin the selection checkout identity
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "source_identity=ci-source-identity-v1 head=${{ github.event.pull_request.head.sha }} base=${{ github.event.pull_request.base.sha }} checkout=$sha workflow=${{ github.workflow_sha }}" >> "$GITHUB_OUTPUT"

      - id: shard
        name: Compute the shard plan (unconditional; every event gets it, --shards 4)
        run: |
          set -euo pipefail
          node .aai/scripts/select-suites.mjs --shards 4 > shard-plan.txt
          bash tests/skills/lib/shard-plan-check.sh --check shard-plan.txt tests/skills >> "$GITHUB_OUTPUT"
          {
            echo 'shard_plan<<SHARD_PLAN_EOF'
            cat shard-plan.txt
            echo 'SHARD_PLAN_EOF'
          } >> "$GITHUB_OUTPUT"

      - id: select
        name: Run select-suites.mjs (PR only; every other event is always full)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "non-PR event (${{ github.event_name }}): full framework always runs"
            exit 0
          fi
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'ci-full') }}" == "true" ]]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "ci-full label present: full framework requested"
            exit 0
          fi
          # fetch-depth: 0 above already fetched full history for every
          # branch (including the base), so origin/<base> is resolvable here.
          OUT="$(node .aai/scripts/ci-select.mjs --base-ref "origin/${{ github.event.pull_request.base.ref }}" --event "$GITHUB_EVENT_PATH" --repo "$GITHUB_REPOSITORY" --workflow-file skill-suite.yml --checkout-sha "${{ steps.identity.outputs.sha }}" --workflow-sha "${{ github.workflow_sha }}" --current-run-id "${{ github.run_id }}")"
          echo "$OUT"
          echo "$OUT" | grep '^CARRY_FORWARD ' >> "$GITHUB_STEP_SUMMARY" || true
          if echo "$OUT" | grep -q '^BODY_REUSE '; then
            echo "mode=body-reuse" >> "$GITHUB_OUTPUT"
            echo "body_proof=$(echo "$OUT" | grep '^BODY_REUSE ')" >> "$GITHUB_OUTPUT"
          elif echo "$OUT" | grep -q '^FULL_RUN'; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=selected" >> "$GITHUB_OUTPUT"
            SUITES="$(echo "$OUT" | grep -E '^(SELECTED|CORE) ' | awk '{print $2}' | sort -u | tr '\n' ' ')"
            echo "suites=$SUITES" >> "$GITHUB_OUTPUT"
          fi

      - name: ${{ steps.identity.outputs.source_identity }}
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.identity.outputs.sha }}"

      - id: selected-plan
        name: Plan and independently check selected execution
        if: steps.select.outputs.mode == 'selected'
        env:
          SELECTED_SUITES: ${{ steps.select.outputs.suites }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SELECTED_SUITES" | tr ' ' '\n' > selected-input.txt
          node .aai/scripts/select-suites.mjs --selected-plan-from selected-input.txt > selected-plan.txt
          bash tests/skills/lib/shard-plan-check.sh --check-selected selected-plan.txt tests/skills selected-input.txt >> "$GITHUB_OUTPUT"
          awk '$1=="SHARDS" {sub("count=", "", $2); print "runners=" $2}' selected-plan.txt >> "$GITHUB_OUTPUT"
          {
            echo 'selected_plan<<SELECTED_PLAN_EOF'
            cat selected-plan.txt
            echo 'SELECTED_PLAN_EOF'
          } >> "$GITHUB_OUTPUT"
          cat selected-plan.txt >> "$GITHUB_STEP_SUMMARY"

      - name: ci-source-plan-v1 full=${{ steps.shard.outputs.shard_ids }} selected=${{ steps.selected-plan.outputs.shard_ids || 'none' }} runners=${{ steps.selected-plan.outputs.runners || 'none' }}
        run: test -n "${{ steps.shard.outputs.shard_ids }}"

  skills-selected:
    name: skill suite (selected, via test-framework.sh --skill)
    needs: select
    if: needs.select.outputs.mode == 'selected' && needs.select.outputs.selected_runners == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AAI_TEST_PARALLEL: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.select.outputs.checkout_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: ${{ needs.select.outputs.source_identity }}
        run: test "$(git rev-parse HEAD)" = "${{ needs.select.outputs.checkout_sha }}"

      - name: Re-check selected membership and run one framework invocation
        env:
          SELECTED_SUITES: ${{ needs.select.outputs.suites }}
          SELECTED_PLAN: ${{ needs.select.outputs.selected_plan }}
          CHECKOUT_SHA: ${{ needs.select.outputs.checkout_sha }}
          SELECTED_SHARD: '1'
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$CHECKOUT_SHA" ] || { echo 'selected checkout identity changed'; exit 1; }
          printf '%s\n' "$SELECTED_SUITES" | tr ' ' '\n' > selected-input.txt
          printf '%s\n' "$SELECTED_PLAN" > selected-plan.txt
          bash tests/skills/lib/shard-plan-check.sh --check-selected selected-plan.txt tests/skills selected-input.txt >/dev/null
          bash tests/skills/lib/shard-plan-check.sh --extract "$SELECTED_SHARD" selected-plan.txt > selected-order.txt
          args=()
          while IFS= read -r s; do
            args+=(--skill "$s")
          done < selected-order.txt
          if [ "${#args[@]}" -eq 0 ]; then
            echo 'selected shard is empty; refusing a full sweep'
            exit 1
          fi
          bash tests/skills/test-framework.sh "${args[@]}"

  skills-selected-sharded:
    name: skill suite (selected sharded, via test-framework.sh --skill)
    needs: select
    if: needs.select.outputs.mode == 'selected' && needs.select.outputs.selected_runners == '2'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.selected_shard_ids) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AAI_TEST_PARALLEL: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.select.outputs.checkout_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: ${{ needs.select.outputs.source_identity }}
        run: test "$(git rev-parse HEAD)" = "${{ needs.select.outputs.checkout_sha }}"

      - name: Re-check selected membership and run one framework invocation
        env:
          SELECTED_SUITES: ${{ needs.select.outputs.suites }}
          SELECTED_PLAN: ${{ needs.select.outputs.selected_plan }}
          CHECKOUT_SHA: ${{ needs.select.outputs.checkout_sha }}
          SELECTED_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$CHECKOUT_SHA" ] || { echo 'selected checkout identity changed'; exit 1; }
          printf '%s\n' "$SELECTED_SUITES" | tr ' ' '\n' > selected-input.txt
          printf '%s\n' "$SELECTED_PLAN" > selected-plan.txt
          bash tests/skills/lib/shard-plan-check.sh --check-selected selected-plan.txt tests/skills selected-input.txt >/dev/null
          bash tests/skills/lib/shard-plan-check.sh --extract "$SELECTED_SHARD" selected-plan.txt > selected-order.txt
          args=()
          while IFS= read -r s; do
            args+=(--skill "$s")
          done < selected-order.txt
          if [ "${#args[@]}" -eq 0 ]; then
            echo 'selected shard is empty; refusing a full sweep'
            exit 1
          fi
          bash tests/skills/test-framework.sh "${args[@]}"

  skills-full:
    name: skill test suite (full framework, via test-framework.sh)
    needs: select
    if: needs.select.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.shard_ids) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AAI_TEST_PARALLEL: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.select.outputs.checkout_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: ${{ needs.select.outputs.source_identity }}
        run: test "$(git rev-parse HEAD)" = "${{ needs.select.outputs.checkout_sha }}"

      - name: Re-check the shard plan on this checkout, then run this leg's shard
        env:
          SHARD_PLAN: ${{ needs.select.outputs.shard_plan }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SHARD_PLAN" > shard-plan.txt
          bash tests/skills/lib/shard-plan-check.sh --check shard-plan.txt tests/skills >/dev/null
          if [ "${{ matrix.shard }}" = "all" ]; then
            bash tests/skills/test-framework.sh
          else
            SUITES="$(bash tests/skills/lib/shard-plan-check.sh --extract ${{ matrix.shard }} shard-plan.txt)"
            args=()
            for s in $SUITES; do
              args+=(--skill "$s")
            done
            bash tests/skills/test-framework.sh "${args[@]}"
          fi

  # Tracked-ignored guard (CHANGE post-validation-pushes-reuse-test-results,
  # Spec-AC-01): no path matched by the repository's own .gitignore files may
  # be tracked. Unconditional (no `if:`) so it runs on every event, and the
  # `gate` job below depends on it, which makes it part of the already
  # required skill-suite context without a branch protection change.

  release-dry-run:
    name: release dry-run (complete tracked changelog readers)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Pester for actual PowerShell reader execution
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -MinimumVersion 5.0
      - name: Rehearse production rollup with every discovered reader
        run: node .aai/scripts/release-dry-run.mjs --jobs 4 --budget-seconds 1080 --report release-dry-run.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-dry-run
          path: release-dry-run.json

  tracked-ignored:
    name: tracked-ignored guard (no gitignored path may be tracked)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fail when the index tracks a path the repository .gitignore ignores
        run: |
          set -euo pipefail
          node .aai/scripts/tracked-ignored.mjs --all

  native-worktree-seed:
    name: worktree seed (native Windows PowerShell 5.1 and pwsh 7)
    needs: select
    if: needs.select.outputs.mode != 'body-reuse'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.checkout_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: ${{ needs.select.outputs.source_identity }}
        shell: pwsh
        run: if ((git rev-parse HEAD) -ne '${{ needs.select.outputs.checkout_sha }}') { throw 'checkout identity changed' }

      - name: TEST-008 under native Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module Pester -ListAvailable | Where-Object { $_.Version.Major -ge 5 })) {
            Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -MinimumVersion 5.0
          }
          Import-Module Pester -MinimumVersion 5.0
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'tests/skills/aai-worktree-seed.Tests.ps1'
          $cfg.Run.PassThru = $true
          $result = Invoke-Pester -Configuration $cfg
          $cases = @($result.Tests | Where-Object { $_.ExpandedPath -like 'worktree seed PowerShell parity.TEST-008*' })
          if ($cases.Count -ne 3 -or @($cases | Where-Object { $_.Result -ne 'Passed' }).Count -ne 0 -or $result.SkippedCount -ne 0 -or $result.FailedCount -ne 0 -or $result.FailedContainersCount -ne 0) {
            throw "TEST-008 Windows PowerShell 5.1: expected 3 passed, 0 skipped/failed; found $($cases.Count) cases, $($result.SkippedCount) skipped, $($result.FailedCount) failed, $($result.FailedContainersCount) failed containers"
          }

      - name: TEST-008 under native Windows pwsh 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module Pester -ListAvailable | Where-Object { $_.Version.Major -ge 5 })) {
            Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -MinimumVersion 5.0
          }
          Import-Module Pester -MinimumVersion 5.0
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'tests/skills/aai-worktree-seed.Tests.ps1'
          $cfg.Run.PassThru = $true
          $result = Invoke-Pester -Configuration $cfg
          $cases = @($result.Tests | Where-Object { $_.ExpandedPath -like 'worktree seed PowerShell parity.TEST-008*' })
          if ($cases.Count -ne 3 -or @($cases | Where-Object { $_.Result -ne 'Passed' }).Count -ne 0 -or $result.SkippedCount -ne 0 -or $result.FailedCount -ne 0 -or $result.FailedContainersCount -ne 0) {
            throw "TEST-008 Windows pwsh 7: expected 3 passed, 0 skipped/failed; found $($cases.Count) cases, $($result.SkippedCount) skipped, $($result.FailedCount) failed, $($result.FailedContainersCount) failed containers"
          }

  # Aggregating gate: carries the EXACT name branch protection already
  # requires ("skill test suite (tests/skills/, via test-framework.sh)").
  # skills-selected and skills-full are mutually exclusive (one is always
  # skipped), so neither leaf job may be a required check — this job is the
  # single always-reporting verdict: it fails unless the mode-relevant leaf
  # succeeded.
  gate:
    name: skill test suite (tests/skills/, via test-framework.sh)
    needs: [select, skills-selected, skills-selected-sharded, skills-full, native-worktree-seed, self-hosting-smoke, tracked-ignored, release-notes, release-dry-run]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the mode-relevant skills job to have succeeded
        env:
          BODY_PROOF: ${{ needs.select.outputs.body_proof }}
        run: |
          set -e
          echo "select=${{ needs.select.result }} mode=${{ needs.select.outputs.mode }} selected=${{ needs.skills-selected.result }} full=${{ needs.skills-full.result }}"
          if [ "${{ needs.select.result }}" != "success" ]; then
            echo "select job did not succeed"; exit 1
          fi
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.release-notes.result }}" != "success" ]; then
            echo "current release notes job did not succeed"; exit 1
          fi
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ needs.release-notes.result }}" != "skipped" ]; then
            echo "unexpected release notes result"; exit 1
          fi
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.release-dry-run.result }}" != "success" ]; then
            echo "release dry-run did not succeed"; exit 1
          fi
          if [ "${{ needs.select.outputs.mode }}" != "body-reuse" ] && [ "${{ needs.native-worktree-seed.result }}" != "success" ]; then
            echo "native Windows worktree seed job did not succeed"; exit 1
          fi
          if [ "${{ needs.select.outputs.mode }}" != "body-reuse" ] && [ "${{ needs.self-hosting-smoke.result }}" != "success" ]; then
            echo "self-hosting smoke job did not succeed"; exit 1
          fi
          if [ "${{ needs.tracked-ignored.result }}" != "success" ]; then
            echo "tracked-ignored guard job did not succeed"; exit 1
          fi
          if [ "${{ needs.select.outputs.mode }}" = "body-reuse" ]; then
            [ "${{ github.event_name }}" = "pull_request" ] && [ -n "$BODY_PROOF" ] || { echo 'missing body reuse proof'; exit 1; }
            [ "${{ needs.skills-selected.result }}" = "skipped" ] && [ "${{ needs.skills-selected-sharded.result }}" = "skipped" ] && [ "${{ needs.skills-full.result }}" = "skipped" ] && [ "${{ needs.native-worktree-seed.result }}" = "skipped" ] && [ "${{ needs.self-hosting-smoke.result }}" = "skipped" ] || { echo 'source job ran in body reuse mode'; exit 1; }
          elif [ "${{ needs.select.outputs.mode }}" = "selected" ]; then
            if [ "${{ needs.select.outputs.selected_runners }}" = "1" ]; then
              [ "${{ needs.skills-selected.result }}" = "success" ] || { echo "selected-mode run failed"; exit 1; }
            elif [ "${{ needs.select.outputs.selected_runners }}" = "2" ]; then
              [ "${{ needs.skills-selected-sharded.result }}" = "success" ] || { echo "selected-sharded run failed"; exit 1; }
            else
              echo 'missing or invalid selected runner count'; exit 1
            fi
          elif [ "${{ needs.select.outputs.mode }}" = "full" ]; then
            [ "${{ needs.skills-full.result }}" = "success" ] || { echo "full-mode run failed"; exit 1; }
          else
            echo 'missing or invalid selection mode'; exit 1
          fi

  self-hosting-smoke:
    name: self-hosting smoke (separate job — bootstraps + re-validates a full copy, ~2-3 min)
    needs: select
    if: needs.select.outputs.mode != 'body-reuse'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.select.outputs.checkout_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: ${{ needs.select.outputs.source_identity }}
        run: test "$(git rev-parse HEAD)" = "${{ needs.select.outputs.checkout_sha }}"

      - name: Run self-hosting smoke test
        run: bash tests/self-hosting/test-self-hosting-smoke.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Node 22 compatibility (downstream floor)
        run: |
          set -euo pipefail
          case "$(node --version)" in v22.*) ;; *) echo "expected Node 22, got $(node --version)"; exit 1 ;; esac
          find .aai/scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
          node --test tests/skills/lib/*.test.mjs
          bash tests/self-hosting/test-self-hosting-smoke.sh
          doctor_rc=0
          node .aai/scripts/aai-doctor.mjs --json > "$RUNNER_TEMP/doctor-node22.json" || doctor_rc=$?
          case "$doctor_rc" in 0|1) ;; *) echo "doctor crashed with exit $doctor_rc"; exit 1 ;; esac
          node -e 'const j = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); const c = j.categories.find((x) => x.id === "CAT-20"); if (c) { console.error("unexpected CAT-20 under Node 22: " + c.reason); process.exit(1); }' "$RUNNER_TEMP/doctor-node22.json"
