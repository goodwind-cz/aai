# tests/skills/suite-map.yaml — CI test-impact selection map
# (CHANGE ci-test-impact-selection / SPEC spec-ci-test-impact-selection).
#
# Consumed by .aai/scripts/select-suites.mjs (hand-rolled line-based parser,
# zero deps — NOT a general YAML file; keep the exact indentation below:
# `core:` / `full_run_triggers:` / `suites:` at column 0, suite names at
# 2 spaces, `globs:` at 4 spaces, list items at 6 spaces).
#
# CONTRACT
# - `core:` names suites that run on EVERY selected-mode PR regardless of the
#   diff (cheap, always-on safety net). They still get a `suites:` row below
#   (with their own real globs) so the hygiene pin (test-aai-hygiene-pack.sh)
#   can prove every test-aai-*.sh file has exactly one row — the row is just
#   redundant for selection purposes since core suites never need matching.
# - `full_run_triggers.shared_lib_globs` names paths that escalate straight
#   to FULL_RUN when touched — shared library code with fan-out no single
#   suite's glob list can safely bound. `docs/ai/docs-audit.yaml`
#   `protected_paths_l3` is read directly (not duplicated here) as the
#   second FULL_RUN trigger class; the third is any changed path matching NO
#   suite below.
# - `suites.<name>.globs` — the paths that make a diff select this suite. Be
#   GENEROUS: over-selection only costs a few extra minutes of CI; under-
#   selection is exactly what the fail-open triad above exists to catch. The
#   selector ALSO implicitly matches `tests/skills/test-<name>.sh` (the
#   suite's own test file) for every suite without it needing to be listed.
# - AC-003 (hygiene pin): every `tests/skills/test-aai-*.sh` file on disk
#   MUST have a corresponding `suites.<name>` row, `<name>` being the
#   filename with the `test-` prefix and `.sh` suffix stripped. A new suite
#   added without a row fails tests/skills/test-aai-hygiene-pack.sh.

core:
  - aai-check-state
  - aai-docs-audit
