# docs/ai/STATE.yaml - AAI runtime state (managed by orchestration; humans need not edit)
#
# CANONICAL SCHEMA / INVARIANTS (authoritative; see .aai/SKILL_CHECK_STATE.prompt.md)
#   project_status:            active | paused
#   current_focus.type:        intake_change | intake_issue | intake_prd | intake_hotfix |
#                              intake_research | intake_rfc | intake_release |
#                              technology_extraction | maintenance | none
#   active_work_items[].status: planned | in_progress | blocked | done
#   active_work_items[].phase:  planning | preparation | implementation | validation |
#                              code_review | remediation
#   implementation_strategy.selected: loop | tdd | hybrid | undecided
#   worktree.recommendation:   not_needed | optional | recommended | required
#   worktree.user_decision:    undecided | worktree | inline | waived
#   code_review.status:        not_run | pass | fail | waived
#   last_validation.status:    pass | fail | not_run
#   updated_at_utc:            ISO 8601 UTC
#   orchestration.mode:        auto | single | parallel   (RFC-0005 / SPEC-0005; default auto)
#   orchestration.k:           integer chosen fan-out for the last tick (1 when single)
#   orchestration.groups:      last selector partition [{kind: parallel|sequential, scopes: [...]}]
#     The whole orchestration block is OPTIONAL and non-breaking: an absent block == auto
#     (back-compat) - existing single-scope projects behave exactly as before.
#     orchestration.mode is also the durable override input (a loop arg may
#     override it per tick). Written by SKILL_LOOP from .aai/scripts/orchestration-mode.mjs.
