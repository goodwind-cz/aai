# .aai/feedback.yaml — RFC-0012 / RFC-0013 friction feedback configuration.
#
# This slice (RFC-0013 Slice A) consumes ONLY the `capture.summary_enabled`
# toggle. The triage/upsert/auto-gate config (mode, destination, budget,
# thresholds, labels) lands in later slices and will be added here then.
#
# CONTRACT
# - Read by .aai/scripts/aai-friction.mjs (capture). Absent or unparseable
#   config FAILS CLOSED — summary capture stays OFF.

capture:
  # RFC-0013 D2 / owner decision 2026-09-05 (docs/ai/decisions.jsonl line 691):
  # automatic capture stays prose-free. OFF is the default and stays OFF: an
  # agent-written sentence no human read would otherwise travel to a PUBLIC
  # issue tracker, and the redactor certifies only "no known-shaped secret",
  # not "no identity" (a bare hostname or a project name written as a word
  # passes it). The human who writes one line and reads it is the control:
  # `record --promote` admits it at record time, `--publish ... --description
  # <file>` supplies one at publish time, both through the same fail-closed
  # redactor; a record with no certified description is NOT filed. The
  # trade-off of flipping this to true is unread prose on a public tracker
  # against nothing today: no automatic producer writes a summary at all.
  summary_enabled: false

triage:
  # RFC-0012 Phase 2 / Slice B. `mode` governs the triage engine
  # (.aai/scripts/aai-feedback-triage.mjs): `local` (default) summarizes to a
  # local report only. `review`/`auto` are parsed but have NO network effect in
  # this slice (later slices add the upsert + auto-gate). Fail-closed to local.
  mode: review
  thresholds:
    # A cluster whose composite score (impact + confidence + reproducible +
    # recurrence) reaches this becomes a `review_candidate` in the report.
    review_candidate: 4

upsert:
  # RFC-0012 Phase 2c / Slice C — review-mode GitHub upsert (approval-gated).
  # A plain run of aai-feedback-upsert.mjs is PREPARE-ONLY (no GitHub write); an
  # issue is filed ONLY via an explicit human `--publish <fp> --confirm`. Active
  # only when triage.mode is `review`. `auto` is refused (locked).
  destination: goodwind-cz/aai   # pinned destination repo (RFC-0012 D1)
  budget:
    max_new_issues_per_7d: 3
  cooldown_days: 7
  labels:
    - aai-friction
