# .aai/system/MODEL_ROUTING.yaml — deterministic tier -> model-id binding.
#
# CONTRACT
# - Consumed by .aai/scripts/orchestration-dispatch.mjs: every dispatch verdict
#   carries `suggested_model` resolved as roles[<role>@<lane>] ?? roles[<role>]
#   ?? tiers[<tier>] ?? null (see LANE-SCOPED ROLE KEYS below). The
#   orchestrator honors suggested_model when the platform supports model
#   selection; suggested_tier remains the fallback hint when it does not.
# - DELETE OR EMPTY THIS FILE to restore pre-binding behavior (suggested_model
#   stays null and the orchestrator LLM interprets suggested_tier itself).
# - Parsed line-based like PROFILES.yaml: keep the exact two-space indentation
#   of `  <key>: <value>` rows; nesting deeper than one level is not read.
# - Model ids must resolve in .aai/system/PRICING.yaml (exact / longest-prefix)
#   so metrics-flush can cost every routed run. Update BOTH files together.
# - WHY: routing ~70% of mechanical/standard calls away from frontier models is
#   the single largest lever on autonomous-run cost. Binding the map here makes
#   the choice deterministic and auditable instead of a per-tick LLM judgment.
# - ADVISORY EFFORT (cache-friendly-dispatch): the optional `effort_tiers:` /
#   `effort_roles:` sections below bind a reasoning-effort hint per role, surfaced
#   as `suggested_effort` on every dispatch (resolution: effort_roles[role] ??
#   effort_tiers[tier] ?? null). Effort is advisory — the harness, not the
#   factory, owns actual API params — and a separate axis from the model tier
#   (a standard-tier Validation is high-effort; a premium-tier Planning is
#   default). Absent sections/file => suggested_effort null (today's output).
# - NO MID-SESSION FLIP (cache-friendly-dispatch, HARD): NEVER flip a role's
#   effort OR model inside one running session/context. Prompt-cache read pricing
#   (~10% of base) applies only while the stable prefix stays byte-identical AND
#   the effort/model key is unchanged — effort and model are part of the cache
#   key, so a mid-session flip invalidates the cache and forfeits the savings on
#   the NEXT call. Right-size per role via SEPARATE dispatches (one tier per
#   dispatch, the factory's existing shape); this file is the single place the
#   per-role choice is bound. A future edit MUST NOT introduce a mid-session
#   effort/model switch.
# - LANE-SCOPED ROLE KEYS: a role row may carry an `@lane` suffix, e.g.
#   `Validation@lightweight`. Resolution order in suggestModel() is
#   roles[role@lane.selected] ?? roles[role] ?? tiers[tier] ?? null, where
#   lane.selected is "lightweight" on ceremony L0/L1 dispatches and "full"
#   otherwise (deriveLane()). A lane-scoped row wins ONLY on a matching-lane
#   dispatch for that exact role; every other dispatch (no @lane key, or a
#   non-matching lane) falls through the chain unchanged. Configs with no
#   @lane keys resolve byte-identically to before this key form existed
#   (additive, back-compat).
# - Role rows take NO inline `# comments` — the parser regex drops any row
#   whose value is followed by a comment. Put comments on their own line.
#
# Tier defaults (dispatch suggested_tier -> model id).
tiers:
  mechanical: claude-haiku-4-5
  standard: claude-sonnet-5
  premium: claude-opus-4-8

# Optional per-role overrides (dispatch role name -> model id). A role row
# beats its tier default. Role names are the dispatch verdict `role` strings,
# e.g. "Code Review", "TDD Implementation", "Metrics Flush".
roles:
  Planning: claude-opus-4-8
  Code Review: claude-opus-4-8
  # Explicit pin, auditable — the mechanical tier default already resolves
  # to this model id today; this row makes the choice visible in the file
  # rather than an implicit tier fallthrough.
  Metrics Flush: claude-haiku-4-5
  # Lane-scoped: wins over the plain tier default ONLY on a ceremony
  # L0/L1 (lightweight-lane) Validation dispatch. With the CURRENT tier
  # map (standard: claude-sonnet-5) this resolves to the SAME model id a
  # full-lane Validation already gets — zero behavioral delta today. The
  # row (a) makes the lightweight-lane choice explicit/auditable and
  # (b) establishes the role@lane resolution mechanism so a later change
  # can pin a genuinely distinct lightweight model without touching tier
  # defaults.
  Validation@lightweight: claude-sonnet-5

# Validator-independence backstop: when the routed Validation model would
# EQUAL the recorded implementer model (same weights = same blind spots),
# dispatch swaps Validation to this model instead (SUBAGENT_PROTOCOL.md
# "Spawning a validator" rule, CHANGE-0010 D1).
validation_alternate: claude-opus-4-8

# Advisory reasoning-effort tier per dispatch (cache-friendly-dispatch).
# Surfaced as `suggested_effort`; resolution effort_roles[role] ??
# effort_tiers[tier] ?? null. Same no-inline-comment rule as the model rows.
# Tier defaults: mechanical work is low-effort; standard/premium default.
effort_tiers:
  mechanical: low
  standard: default
  premium: default

# Per-role effort overrides (beat the tier default). Verification-class roles
# reason hard about correctness -> high; Planning/Implementation stay default
# (premium/standard tier default already resolves them); mechanical roles stay
# low via the tier default. A role with no row falls through to its tier.
effort_roles:
  Validation: high
  Code Review: high
