# .aai/system/MODEL_ROUTING.yaml — deterministic tier -> model-id binding,
# now scoped per harness (harness-universal-routing).
#
# CONTRACT
# - Consumed by .aai/scripts/orchestration-dispatch.mjs: every dispatch verdict
#   carries `suggested_model`. The orchestrator honors suggested_model when
#   the platform supports model selection; suggested_tier remains the
#   fallback hint when it does not. `harness` (the closed set claude / codex /
#   gemini / cursor / unknown, detected once per process from the environment
#   -- see .aai/scripts/lib/harness.mjs) is carried on every verdict.
# - DELETE OR EMPTY THIS FILE to restore pre-binding behavior (suggested_model
#   stays null and the orchestrator LLM interprets suggested_tier itself).
# - Parsed line-based like PROFILES.yaml: keep the exact two-space indentation
#   of `  <key>: <value>` rows; nesting deeper than one level is not read.
# - Model ids must resolve in .aai/system/PRICING.yaml (exact / longest-prefix)
#   so metrics-flush can cost every routed run. Update BOTH files together.
# - WHY: routing ~70% of mechanical/standard calls away from frontier models is
#   the single largest lever on autonomous-run cost. Binding the map here makes
#   the choice deterministic and auditable instead of a per-tick LLM judgment.
#
# UPGRADING (NB-6, review-harness-universal-routing-20260913T002056Z; owner
# decision 2026-09-24, spec-update-installs-ref-guard-undisclosed Amendment 2)
# -- this file is CORE-VENDORED (`.aai/system/PROFILES.yaml` `core:`), so
# `/aai-update` OVERWRITES a consumer's copy with the shipped file, same as
# every other core-listed file, and this is INTENTIONAL: the table tracks a
# moving external world (model retirements, new tiers, pricing) that a
# consumer's own unsuffixed edit cannot track for them, so the update keeps
# overwriting it rather than freezing it at whatever a consumer last edited.
# A consumer with a hand-edited MODE A file (no `@<harness>` sections) keeps
# byte-identical behaviour (Spec-AC-06) ONLY UNTIL the next update replaces
# the file -- Mode A back-compat is a property of the CODE reading an
# old-shaped file, not a guarantee that the file itself survives an update.
# To keep a customization (a tier pin, a role override, a cost cap) across
# updates, re-apply it as one or more `@<harness>` sections (Mode B, see the
# key-form contract below) in THIS file after each update. A central process
# that keeps this table current, plus a separate consumer-owned config the
# update never overwrites, is its own intake
# (`CHANGE-DRAFT-routing-tables-have-an-owner-and-a-seam`) -- NOT a change to
# this file's overwrite behaviour, which stays exactly as described above.
#
# HARNESS-SCOPED KEY FORM (harness-universal-routing D1)
# - `tiers:` / `roles:` / `validation_alternate:` may each carry an
#   `@<harness>` section suffix, e.g. `tiers@claude:`, `roles@codex:`,
#   `validation_alternate@gemini:` -- the same `@` sigil the file already uses
#   for lane-scoped role keys (`Validation@lightweight`, below). Rows
#   underneath an `@<harness>` section keep the EXACT same two-space
#   `  <key>: <value>` shape as an unsuffixed section.
# - Per-harness resolution order, inside the detected harness's own map ONLY: roles@<harness>[role@lane] -> roles@<harness>[role] -> tiers@<harness>[tier] -> null.
# - MODE A vs MODE B (D2), decided by the FILE, never by the harness:
#   MODE A -- this file declares ZERO `@<harness>` sections. Resolution is
#   exactly the pre-harness-routing logic, byte-identical on every harness,
#   including the validator-independence swap (unaffected by the detected
#   harness). This is the shape every downstream AAI project's existing copy
#   of this file is in today -- back-compat is structural, not argued.
#   MODE B -- this file declares one or more `@<harness>` sections (the
#   shipped file below). The detected harness H selects `tiers@H` /
#   `roles@H` / `validation_alternate@H` ONLY; the unsuffixed
#   `tiers:`/`roles:`/`validation_alternate:` sections are NOT consulted for
#   model resolution (falling through to them is the bug this file's harness
#   scoping exists to remove -- a Codex loop handed a Claude id). A harness
#   with no shipped section -- `unknown` and `cursor` included -- resolves
#   `suggested_model: null`, with `suggested_tier` unaffected, exactly as
#   when this file is absent. A Mode B file that STILL carries leftover
#   unsuffixed model rows emits ONE stderr NOTE naming them and continues
#   (degrade and report); the shipped file below carries none, so the NOTE
#   never fires on a clean install.
# - An `@<suffix>` outside the closed harness set (claude / codex / gemini /
#   cursor / unknown, exact and case-sensitive -- e.g. `tiers@CLAUDE:` or
#   `tiers@codx:`) is a typo, not a new harness: that section is ignored with
#   ONE stderr NOTE naming it and does NOT select Mode B on its own -- a file
#   whose only `@<harness>` section(s) are all invalid stays Mode A.
# - `effort_tiers:` / `effort_roles:` below are NEVER harness-scoped: advisory
#   reasoning effort is a property of the ROLE, not the vendor, and is read
#   identically in Mode A and Mode B.
# - VALIDATOR INDEPENDENCE, per harness (D4): when a Mode B Validation
#   dispatch's routed model would equal the recorded implementer model, the
#   replacement is scanned INSIDE the detected harness's own map only --
#   first `tiers@H` at or above the routed tier (mechanical < standard <
#   premium), then `validation_alternate@H` -- and NEVER an id from another
#   harness's map (a Codex validator proposed a Claude id is worse than no
#   swap). When the harness's own map cannot supply a different id, the model
#   is kept and the verdict's `validator_independence.residual` is set to the
#   literal token `single_model_harness_reuse` (SUBAGENT_PROTOCOL.md
#   "Spawning a validator" rule). Mode A keeps the single-alternate swap
#   below, unchanged.
#
# ADVISORY EFFORT (cache-friendly-dispatch): the optional `effort_tiers:` /
# `effort_roles:` sections below bind a reasoning-effort hint per role, surfaced
# as `suggested_effort` on every dispatch (resolution: effort_roles[role] ??
# effort_tiers[tier] ?? null). Effort is advisory — the harness, not the
# factory, owns actual API params — and a separate axis from the model tier
# (a standard-tier Validation is high-effort; a premium-tier Planning is
# default). Absent sections/file => suggested_effort null (today's output).
#
# NO MID-SESSION FLIP (cache-friendly-dispatch, HARD): NEVER flip a role's
# effort OR model inside one running session/context. Prompt-cache read pricing
# (~10% of base) applies only while the stable prefix stays byte-identical AND
# the effort/model key is unchanged — effort and model are part of the cache
# key, so a mid-session flip invalidates the cache and forfeits the savings on
# the NEXT call. Right-size per role via SEPARATE dispatches (one tier per
# dispatch, the factory's existing shape); this file is the single place the
# per-role choice is bound. A future edit MUST NOT introduce a mid-session
# effort/model switch. This includes the HARNESS itself (harness-universal-
# routing D6): detection runs ONCE per process and is recorded with the
# verdict, never re-derived mid-session.
#
# LANE-SCOPED ROLE KEYS: a role row may carry an `@lane` suffix, e.g.
# `Validation@lightweight`. Resolution order in suggestModel() is
# roles[role@lane.selected] ?? roles[role] ?? tiers[tier] ?? null (Mode A), or
# the same chain read from the detected harness's own map (Mode B), where
# lane.selected is "lightweight" on ceremony L0/L1 dispatches and "full"
# otherwise (deriveLane()). A lane-scoped row wins ONLY on a matching-lane
# dispatch for that exact role; every other dispatch (no @lane key, or a
# non-matching lane) falls through the chain unchanged. Configs with no
# @lane keys resolve byte-identically to before this key form existed
# (additive, back-compat).
#
# Role rows take NO inline `# comments` — the parser regex drops any row
# whose value is followed by a comment. Put comments on their own line.

# --- claude -------------------------------------------------------------

# Tier defaults (dispatch suggested_tier -> model id).
tiers@claude:
  mechanical: claude-haiku-4-5
  standard: claude-sonnet-5
  premium: claude-opus-5

# Optional per-role overrides (dispatch role name -> model id). A role row
# beats its tier default. Role names are the dispatch verdict `role` strings,
# e.g. "Code Review", "TDD Implementation", "Metrics Flush".
roles@claude:
  Planning: claude-opus-5
  Code Review: claude-opus-5
  # Explicit pin, auditable — the mechanical tier default already resolves
  # to this model id today; this row makes the choice visible in the file
  # rather than an implicit tier fallthrough.
  Metrics Flush: claude-haiku-4-5
  # Lane-scoped: wins over the plain tier default ONLY on a ceremony
  # L0/L1 (lightweight-lane) Validation dispatch. With the CURRENT tier
  # map (standard: claude-sonnet-5) this resolves to the SAME model id a
  # full-lane Validation already gets — zero behavioral delta today. The
  # row (a) makes the lightweight-lane choice explicit/auditable and
  # (b) establishes the role@lane resolution mechanism so a later change
  # can pin a genuinely distinct lightweight model without touching tier
  # defaults.
  Validation@lightweight: claude-sonnet-5

# Validator-independence backstop: when the routed Validation model would
# EQUAL the recorded implementer model (same weights = same blind spots),
# dispatch swaps Validation to this model instead (SUBAGENT_PROTOCOL.md
# "Spawning a validator" rule, CHANGE-0010 D1).
validation_alternate@claude: claude-opus-5

# --- codex ----------------------------------------------------------------

tiers@codex:
  mechanical: gpt-5-mini
  standard: gpt-5
  premium: gpt-5.3-codex

roles@codex:
  Planning: gpt-5.3-codex
  Code Review: gpt-5.3-codex
  Metrics Flush: gpt-5-mini

validation_alternate@codex: gpt-5.3-codex

# --- gemini -----------------------------------------------------------------

# Mechanical and standard bind the SAME id: the current Gemini 3 lineup in
# PRICING.yaml has two members, not three (disclosed, not papered over with a
# previous-generation id) — the mechanical-vs-standard distinction survives
# on the harness-independent effort axis (effort_tiers/effort_roles below).
tiers@gemini:
  mechanical: gemini-3-flash-preview
  standard: gemini-3-flash-preview
  premium: gemini-3-pro-preview

roles@gemini:
  Planning: gemini-3-pro-preview
  Code Review: gemini-3-pro-preview
  Metrics Flush: gemini-3-flash-preview

validation_alternate@gemini: gemini-3-pro-preview

# --- cursor -----------------------------------------------------------------
# Detected (.aai/scripts/lib/harness.mjs), but ships NO map here: cursor runs
# whichever model the user selected, and inventing a binding would assert a
# fact this project has not measured. suggested_model resolves null on
# cursor; suggested_tier stands as the fallback hint.

# --- advisory reasoning effort (harness-independent) -------------------------

# Advisory reasoning-effort tier per dispatch (cache-friendly-dispatch).
# Surfaced as `suggested_effort`; resolution effort_roles[role] ??
# effort_tiers[tier] ?? null. Same no-inline-comment rule as the model rows.
# Tier defaults: mechanical work is low-effort; standard/premium default.
effort_tiers:
  mechanical: low
  standard: default
  premium: default

# Per-role effort overrides (beat the tier default). Verification-class roles
# reason hard about correctness -> high; Planning/Implementation stay default
# (premium/standard tier default already resolves them); mechanical roles stay
# low via the tier default. A role with no row falls through to its tier.
effort_roles:
  Validation: high
  Code Review: high
