# AI Model Pricing Reference
# Costs are in USD per 1,000,000 tokens.
# Keep backwards compatibility for calculators reading:
#   models.<model_id>.input_usd_per_m
#   models.<model_id>.output_usd_per_m
# Optional row field unverified_utc: "<run stamp>" — the monthly refresh at that
# stamp tried and could not verify the row from a primary source; its rates and
# last_verified_utc stay as they were and the rates still cost. A later
# successful verification removes the field. Marking a row is a priced-line
# change, so table-freshness.mjs stamp-guard requires pricing_meta.last_updated_utc
# to move with it; table-freshness.mjs priced --since <date> reports every row.

schema_version: 2

pricing_meta:
  currency: USD
  token_unit: per_1m_tokens
  default_effective_region: global
  last_updated_utc: "2026-11-14T21:52:16Z"
  # CHANGE-0197 catalog families with no public list price (verified 2026-09-29; re-checked 2026-11-14):
  # composer-2.5 — https://cursor.com/docs/models-and-pricing — 2026-11-14: Cursor now lists Composer 2.5 at $0.50/$2.50 per 1M (Fast $3/$15); still no models key because no run of it is in METRICS.jsonl history.
  # cursor-grok-4.6 — https://cursor.com/docs/models-and-pricing — 2026-11-14: Cursor now lists Grok 4.6 at $2/$6 per 1M, so the row below is priced (it was null-priced until this refresh).
  # muse-spark-1.3 — https://docs.cursor.com/models (checked 2026-09-29; 2026-11-14 the page no longer lists Muse Spark, only Muse Wonder, with no token rate) — no public USD/1M input/output list price for Muse Spark 1.3 runtime ids.
  # CHANGE-0198 (verified 2026-09-30): gpt-6.1-astra — https://developers.openai.com/api/docs/pricing — no separate model row; only gpt-6-astra and gpt-6.1-sol appear on the flagship table (do not invent a gpt-6.1-astra key).
  # Owner 2026-09-29: gpt-6.1-sol added below (OpenAI flagship); MODEL_ROUTING.yaml unchanged in this change.
  # First refresh 2026-11-13 (routing-tables-have-an-owner-and-a-seam): rates and ids re-read on the vendor pages in sources: below; claude-opus-5-5 5/25 -> 4/20, claude-sonnet-5(-5) 3/15 -> 2/10; added claude-haiku-5-5, claude-fable-5-2 (priced only), gpt-6.1-terra, gemini-3.1-pro-preview.
  # Refresh 2026-11-14 (owner-directed, pre-release): every row re-read; o3 10/40 -> 2/8; cursor-grok-4.6 null -> 2/6 (Cursor rate card); added gpt-5.5 (in METRICS history, was mis-costed at gpt-5 rates by longest prefix); marked unverified (no longer on the vendor pricing page, shut down): gemini-2.0-flash, gemini-2.0-flash-lite, gemini-1.5-pro, gemini-3-pro-preview, o4-mini.

update_policy:
  cadence_days: 30
  require_source_ref: true
  require_last_verified_utc: true
  on_unknown_model: "add model with null pricing and source_ref, then verify"
  # CHANGE-0010 D4 prune rule (measurable): delete every models: entry that has
  # null pricing AND does not appear in docs/ai/METRICS.jsonl history, plus its
  # now-dangling model_aliases rows. `unknown` is always kept. Priced entries
  # stay (valid data, other AAI projects may record them).
  prune_rule: "null-priced AND absent from METRICS.jsonl history => delete (keep `unknown`)"
  update_steps:
    - "Read official vendor pricing page."
    - "Update model entry prices and last_verified_utc."
    - "If pricing is tiered, store standard list price in notes."
    - "Run metrics/report flow and verify null/known costs."

# Deterministic model-id resolution for calculators/flush (CHANGE-0010 D4).
# Apply the steps IN ORDER; the first step that lands on a `models:` key wins:
#   1. strip-bracket-suffix: remove ONE trailing bracket suffix `[...]` from the
#      runtime id (claude-opus-4-8[1m] -> claude-opus-4-8)
#   2. model-aliases: apply the model_aliases map below
#   3. exact-match: exact key match in models
#   4. longest-prefix: longest models key that is a prefix of the id
#   5. unknown-fallback: fall back to the `unknown` entry
lookup_rules:
  order:
    - strip-bracket-suffix
    - model-aliases
    - exact-match
    - longest-prefix
    - unknown-fallback
  strip_suffix_pattern: "\\[[^\\]]*\\]$"

# telemetry-fields-not-prose D5: the input/output SHARE metrics-flush.mjs uses
# to blend a cost estimate out of a run's undecomposed token TOTAL (tokens_total
# field, or failing that the usage_total_tokens= note marker) when no
# tokens_in/tokens_out split was recorded. Measured fact this key exists to
# make explicit: this repository has NO recorded input/output ratio anywhere
# (628 recorded runs, zero carrying both tokens_in and tokens_out) — 0.5 is the
# midpoint of the only interval that IS known, not an observation. Every
# derived cost carries `cost_basis: total-blended` plus `cost_bounds_usd`
# (the all-input / all-output extremes), so a reader who needs the true width
# — or a different share — is never stuck with only the point estimate.
cost_blend:
  input_share: 0.5
  basis: convention
  source_ref: null
  reason: "no run in docs/ai/METRICS.jsonl carries both tokens_in and tokens_out (0 of 628, measured); docs/ai/LOOP_TICKS.jsonl does not exist in this worktree and its in/out-split claim is NOT VERIFIABLE HERE, not asserted as fact — 0.5 is the interval midpoint, not a measurement"

