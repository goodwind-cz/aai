# .aai/system/HARNESS_SKILLS.yaml — declared per-tree skill-mirror transform
# (CHANGE harness-surfaces-drift-unguarded /
#  docs/specs/SPEC-0154-spec-harness-surfaces-drift-unguarded.md, D1).
#
# CONTRACT
# - Source tree is ALWAYS .claude/skills/*/SKILL.md — hardcoded in
#   .aai/scripts/sync-harness-skills.mjs, never a sink, never declared here.
# - `trees:` lists the THREE mirror trees this repo ships and, per tree, the
#   one-line transform `<tree>|<model>|<readme>`. The set of trees this
#   generator will ever mirror is ALSO hardcoded (REQUIRED_MIRROR_TREES in
#   .aai/scripts/sync-harness-skills.mjs) — adding a row here for a tree not
#   in that list is refused (exit 2), never silently accepted. To add or
#   remove a mirror tree, edit REQUIRED_MIRROR_TREES in the script FIRST,
#   then add/remove its row here:
#     <tree>    repo-relative mirror directory, e.g. .codex/skills
#     <model>   carry | drop — whether the source frontmatter's `model:` line
#               survives into this tree's copy (name/description/body are
#               ALWAYS verbatim; only `model` is ever selectively dropped)
#     <readme>  yes | no — whether the generator also regenerates
#               <tree>/README.md from the live skill set
#   The generator refuses to run (exit 2, naming the tree) if any of the three
#   required trees has no row here — it never falls back to a built-in default
#   for an undeclared tree (Article 4: degrade and report, never guess).
# - `exclusions:` forgives exactly one (tree, skill) pair from the parity
#   guard's set-equality check, as `<tree>|<skill>|<reason>`. `<reason>` MUST
#   be non-empty, and `<skill>` MUST exist under .claude/skills — an entry
#   that fails either check is a STALE EXCLUSION and fails the guard rather
#   than being silently tolerated. Shipped EMPTY: normalization leaves
#   nothing that needs forgiving.
# - `shims:` lists the SIX root instruction shims this repo generates
#   (SPEC spec-provider-adapter-registry-slice, RFC-0017 phase 4), one row
#   `<path>|<fragments>|<name>|<cli>` each. <fragments> is a `+`-joined ordered
#   list of fragment ids defined in .aai/system/HARNESS_SHIMS.md (the prose
#   lives there, not here); <name> and <cli> are the values of the only two
#   placeholders {{name}} and {{cli}}, `-` when the fragments use none. The
#   allowed paths are hardcoded in .aai/scripts/lib/harness-shims.mjs: when the
#   section is present it must hold exactly CLAUDE.md, AGENTS.md, CODEX.md,
#   GEMINI.md, .github/copilot-instructions.md and .cursor/rules/aai.mdc, each
#   once; any other shape is refused (exit 2). A manifest without the section
#   (test fixtures) generates and checks no shim. The files are GENERATED by
#   .aai/scripts/sync-harness-skills.mjs (--write) and gated by its --check;
#   do not hand-edit them. No in-file "generated" marker is written on purpose:
#   it would change the bytes of every installed shim and report each as a
#   local-change conflict downstream. .aai/system/COPILOT_SHIM_SHIPPED.list is
#   the generator-maintained record of shipped Copilot shim versions.
# - `catalog:` (optional, one row `<file>|<heading>`) opts the SKILLS.md Quick
#   Reference into the generator (SPEC spec-provider-adapter-surfaces-closing-slice
#   D1/D2, .aai/scripts/lib/skills-catalog.mjs): --check lists a wrapper without a
#   row and a row without a wrapper; --write appends generated rows and removes
#   orphans, never touching existing rows. A manifest without it checks nothing.
# - Line-based parseable (two-space dash items, `#` comments ignored) in the
#   same discipline as .aai/system/PROFILES.yaml, so both the bash parity
#   arms in tests/skills/test-aai-hygiene-pack.sh and the node generator can
#   read it without a YAML dependency. Keep the exact indentation below.
#
# D2 — this repo does NOT ship .cursor/skills/, now or later. Cursor loads
# project skills from four paths: .agents/skills/, .cursor/skills/ and, for
# compatibility, .claude/skills/ and .codex/skills/. This repo already ships
# three of those four. A .cursor/skills/ copy would add a fourth place to
# drift and zero additional skills visible to Cursor, because everything it
# could offer is already offered by .agents/skills/ — see
# docs/specs/SPEC-0154-spec-harness-surfaces-drift-unguarded.md D2 for the full
# rationale; this paragraph exists so the next reader does not "fix" the
# absence of .cursor/skills/.
#
# D3 — the duplicate offering is NAMED here, not resolved, because it cannot
# be resolved from this repo. Cursor loads .agents/skills/, .claude/skills/
# and .codex/skills/, and this repo ships all three, so every one of the
# skill names in .claude/skills is offered to Cursor three times. Cursor's
# documentation states no dedup rule and no precedence order across those
# three directories, so which copy a Cursor user actually sees is undefined
# by the vendor. What normalization CAN do, and does, is make the three
# copies agree: an identical `name` and an identical `description` in every
# tree, so whichever one wins, the user reads the same sentence.

trees:
  - .agents/skills|carry|no
  - .codex/skills|drop|yes
  - .gemini/skills|drop|yes

exclusions:

shims:
  - CLAUDE.md|claude-title+pointer-body|-|-
  - AGENTS.md|agents-title+pointer-body|-|-
  - CODEX.md|wrapper-title+wrapper-intro+skill-discovery-heading+no-skill-list+wrapper-tree+wrapper-how-to-proceed|Codex|codex
  - GEMINI.md|wrapper-title+wrapper-intro+skill-discovery-heading+no-skill-list+wrapper-tree+wrapper-how-to-proceed|Gemini|gemini
  - .github/copilot-instructions.md|copilot-main+skill-discovery-heading+no-skill-list+copilot-project-skills|-|-
  - .cursor/rules/aai.mdc|cursor-rule|-|-

catalog:
  - SKILLS.md|## Quick Reference
